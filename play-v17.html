<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
}

body {
    position: relative;

}



/* =================================================
   CICAN
================================================= */

.one {

    position: absolute;

    border-radius: 50%;

    background: white;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    box-shadow:
        0 0 10px white,
        0 0 25px rgba(255,255,255,0.8),
        0 0 45px rgba(255,255,255,0.4);
}


/* =================================================
   CICAN FACE
================================================= */

.cican-face {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 42%;
    height: 42%;

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}

.eye {

    position: absolute;

    width: 22%;
    height: 34%;

    top: 28%;

    background: #000;

    border-radius: 50%;
}

.eye.left {
    left: 18%;
}

.eye.right {
    right: 18%;
}


/* =================================================
   MERGED CICAN
================================================= */

.memory-one {

    box-shadow:
        0 0 12px white,
        0 0 30px white,
        0 0 55px rgba(255,255,255,0.9);
}


/* =================================================
   TRAIL
================================================= */
/* =================================================
   TRAIL
================================================= */

.trail {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    opacity: 0.8;

    box-shadow:
        0 0 6px white;

    animation:
        fadeTrail 1.5s linear forwards;
}


@keyframes fadeTrail {

    from {
        opacity: 0.8;
    }

    to {
        opacity: 0;
    }
}


/* =================================================
   HUD
================================================= */

#hud {

    position: fixed;

    top: 18px;
    left: 18px;

    z-index: 1000;

    color: white;

    pointer-events: none;

    user-select: none;
    -webkit-user-select: none;
}

#brand {

    font-size: 17px;

    font-weight: bold;

    letter-spacing: 2px;
}

#subtitle {

    margin-top: 5px;

    font-size: 11px;

    letter-spacing: 1.5px;

    opacity: 0.6;
}


/* =================================================
   RESET
================================================= */

#reset {

    position: fixed;

    top: 20px;
    right: 20px;

    z-index: 1000;

    padding: 10px 16px;

    border:
        1px solid
        rgba(255,255,255,0.35);

    border-radius: 20px;

    background:
        rgba(0,0,0,0.6);

    color: white;

    font-size: 14px;

    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


/* =================================================
   READ OBJECT
================================================= */

.knowledge {

    position: absolute;

    width: 68px;
    height: 68px;

    border-radius: 50%;

    background: white;

    color: black;

    transform:

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 1px;

    -webkit-user-select: none;

}

.knowledge.dragging {

/* =================================================
   PROLOGUE
================================================= */

#prologue {

/* =================================================
   READER
================================================= */

    align-items: center;
    justify-content: center;

}

#reader.open {

}

.reader-panel {

    width: min(94vw, 760px);

    height: min(92vh, 860px);

    max-height: 100%;

    background:
        linear-gradient(

            #080808 0%,

    flex-direction: column;

    overflow: hidden;

}

.reader-header {

}

#readerLabel {

#readerClose {

/* =================================================

================================================= */

#readerProgress {

}

#readerProgressFill {

    width: 0%;

/* =================================================

================================================= */

.reader-modebar {

}

.reader-mode {

    flex: 1;

#readerText::-webkit-scrollbar-track {

/* =================================================

================================================= */

.reader-button:active,

/* =================================================
   MOBILE
================================================= */

@media(prefers-reduced-motion: reduce) {

    .trail,
    .dhamma-thought,
    .tao-flow {

        transition: none;
    }

    #readerClose,

</style>

<script>
/*
==================================================
CICAN — PLAY THE BOOK V17
MULTI-BOOK LOADER
==================================================
*/

const requestedBookId =
    new URLSearchParams(window.location.search).get("book");

const selectedBookId =
    requestedBookId
        ? requestedBookId
        : null;

/*
    V16 HAS NO DEFAULT BOOK.

    Missing or invalid ?book= means
    CICAN only.
*/

window.BOOK_READ = null;

window.CICAN_ACTIVE_BOOK = null;
window.CICAN_ACTIVE_BOOK_ID = null;

document.getElementById("subtitle").textContent = "";
document.getElementById("prologueTitle").textContent = "";
document.getElementById("readerTitle").textContent = "";

async function startCicanBook() {

    if (!selectedBookId) {

        window.CICAN_ACTIVE_BOOK =
            null;

        window.CICAN_ACTIVE_BOOK_ID =
            null;

        initializeCicanBook(
            null,
            null
        );

        return;
    }

    /*
        Clear any previous global book before
        loading the requested book.
        The central catalog remains the discovery source; publication status is kept separate from experience loading.
    */

    try {
        const loader = await import("./engine/book-loader.js?v=17.3");
        const BOOK_READ = await loader.loadBook(selectedBookId);

        const hasReaderSource =
            BOOK_READ &&
            (
                String(BOOK_READ.text || "").trim() ||
                String(BOOK_READ.fifteenMinuteText || "").trim() ||
                String(BOOK_READ.fullText || "").trim() ||
                String(BOOK_READ.fullTextUrl || "").trim()
            );

        if (!BOOK_READ || !BOOK_READ.title || !hasReaderSource) {
            throw new Error("Selected CICAN book did not provide playable content: " + selectedBookId);
        }

        window.BOOK_READ = BOOK_READ;
        window.CICAN_ACTIVE_BOOK = BOOK_READ;
        window.CICAN_ACTIVE_BOOK_ID = selectedBookId;

        initializeCicanBook(
            BOOK_READ,
            selectedBookId
        );
    } catch (error) {
        console.warn(error.message || error);
        window.BOOK_READ = null;
        window.CICAN_ACTIVE_BOOK = null;
        window.CICAN_ACTIVE_BOOK_ID = null;
        initializeCicanBook(null, null);
    }
}

</script>


<script>


function initializeCicanBook(
    BOOK_READ,
    BOOK_ID
) {


/*
==================================================
CICAN — PLAY THE BOOK V16
==================================================

V13 CORE ENGINE PRESERVED.

V14 READER:

The complete book is rendered normally.

The reader viewport moves continuously
through the book.

There is NO word-by-word display.

There are NO three-word chunks.

There is NO typing effect.

The movement is calculated from real
elapsed time using requestAnimationFrame.

The book itself is external to this engine.

==================================================
*/


/* =================================================
   V13 CONSTANTS
================================================= */

const MIN_SIZE = 34;

const MAX_SIZE = 180;

const DOUBLE_TAP_TIME = 350;

const TRAIL_DISTANCE = 35;

const MERGE_DISTANCE = 20;

/* CICAN merge when their visible bodies touch; keeps the original 20px minimum. */
const FULL_SIZE_TOLERANCE = 0;


/* =================================================
   PLAYABLE CICAN
================================================= */

let ones = [];


/* =================================================
   CONTROL
================================================= */

let selectedOne = null;

let growing = false;

let lastTap = 0;

let lastTappedOne = null;


/* =================================================
   BOOK / READER STATE
================================================= */

let readObjects = [];

let currentBook = null;

let readerAnimation = null;

let readerPaused = false;

let readerComplete = false;

let readerSeconds = 900;
let readerTotalSeconds = 900;

let readerLastTime = 0;

let readerScrollPosition = 0;
let readingMode = "15";
let fullTextLoading = false;
let readerOpenToken = 0;

const TARGET_READING_SECONDS =
    Math.max(
        60,
        Number(
            BOOK_READ &&
            BOOK_READ.targetMinutes
        ) * 60 || 900
    );

const FULL_BOOK_WORDS_PER_MINUTE = 180;

const READER_STATE_PREFIX =
    "cican_reader_position:";

const READER_MODE_PREFIX =
    "cican_reader_mode:";

let lastReaderSaveTime = 0;


/* =================================================
   BOOK
================================================= */

currentBook =
    BOOK_READ;


if (currentBook && window.CICAN_ACTIVE_BOOK_ID) {
    try {
        const savedMode = localStorage.getItem(READER_MODE_PREFIX + window.CICAN_ACTIVE_BOOK_ID);
        if (savedMode === "15" || savedMode === "full") readingMode = savedMode;
    } catch (_) {}
}


/* =================================================
   LOAD BOOK UI
================================================= */

if (BOOK_READ) {

    document.getElementById(
        "subtitle"
    ).textContent =
        BOOK_READ.title;

    document.getElementById(

/* =================================================
   DISTANCE
================================================= */

function distance(
    ax,
    ay,
    bx,
    by
) {

    const dx =
        bx - ax;

    const dy =
        by - ay;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =================================================
   CREATE CICAN
================================================= */

function createOne(
    px,
    py,
    startingSize = MIN_SIZE,
    isMemory = false
) {

    const element =
        document.createElement("div");

    element.className =
        "one";


    if (isMemory) {

        element.classList.add(
            "memory-one"
        );
    }


    document.body.appendChild(
        element
    );


    const face =
        document.createElement("div");

    face.className =
        "cican-face";

    face.innerHTML =
        '<div class="eye left"></div>' +
        '<div class="eye right"></div>';

    element.appendChild(face);


    const one = {

        x: px,
        y: py,

        targetX: px,
        targetY: py,

        size: startingSize,

        element: element,

        isMemory: isMemory,

        lastTrailX: px,
        lastTrailY: py
    };


    ones.push(one);

    updateOne(one);

    return one;
}


/* =================================================
   UPDATE CICAN
================================================= */

function updateOne(one) {

    one.element.style.left =
        one.x + "px";

    one.element.style.top =
        one.y + "px";

    one.element.style.width =
        one.size + "px";

    one.element.style.height =
        one.size + "px";
}


/* =================================================
   TRAIL
================================================= */

function createTrail(
    px,
    py
) {

    const trail =
        document.createElement(

        );

    );


    setTimeout(

    );
}


/* =================================================
   FIND CLOSEST CICAN
================================================= */

function findClosestOne(
    px,
    py
) {

    if (
        ones.length === 0
    ) {

        return null;
    }


    let closest = null;

    let closestDistance =
        Infinity;


    for (
        const one of ones
    ) {

        const d =
            distance(
                px,
                py,
                one.x,
                one.y
            );


        if (
            d <
            closestDistance
        ) {

            closestDistance = d;

            closest = one;
        }
    }


    return closest;
}


/* =================================================
   SPLIT
================================================= */

function splitOne(one) {

    const newOne =
        createOne(
            one.x + 45,
            one.y,
            MIN_SIZE,
            false
        );


    newOne.targetX =
        newOne.x;

    newOne.targetY =
        newOne.y;


    selectedOne =
        one;

    growing = false;
}


/* =================================================
   MERGE
================================================= */

function mergeOnes(
    oneA,
    oneB
) {

    const mergeX =
        (
            oneA.x +
            oneB.x
        ) / 2;

    const mergeY =
        (
            oneA.y +
            oneB.y
        ) / 2;


    const mergedSize =
        Math.min(
            MAX_SIZE,
            oneA.size +
            oneB.size
        );


    /*
        READ is a deliberate final gate:
        BOTH CICANs must already be full size.
        A full CICAN merging with a smaller CICAN
        does not unlock READ.
    */
    const oneAIsFullSize =
        oneA.size >= MAX_SIZE - FULL_SIZE_TOLERANCE;

    const oneBIsFullSize =
        oneB.size >= MAX_SIZE - FULL_SIZE_TOLERANCE;

    const createsKnowledge =
        oneAIsFullSize && oneBIsFullSize;


    oneA.element.remove();

    oneB.element.remove();


    ones =
        ones.filter(
            one =>
                one !== oneA &&
                one !== oneB
        );


    const mergedOne =
        createOne(
            mergeX,
            mergeY,
            mergedSize,
            createsKnowledge
        );


    selectedOne =
        mergedOne;

    growing = false;


    /*
        A full + full merge is the definitive READ unlock.
        The selected book is already loaded before gameplay
        begins, so READ creation must not depend on the
        mutable reader state variable.
    */
    if (
        createsKnowledge &&
        (window.CICAN_ACTIVE_BOOK || BOOK_READ)
    ) {
        createKnowledge(mergeX, mergeY);
    }
}


/* =================================================
   CHECK MERGE
================================================= */

function checkForMerges() {

    if (
        ones.length < 2
    ) {

        return;
    }


    for (
        let i = 0;
        i < ones.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < ones.length;
            j++
        ) {

            const oneA =
                ones[i];

            const oneB =
                ones[j];


            const d =
                distance(
                    oneA.x,
                    oneA.y,
                    oneB.x,
                    oneB.y
                );


            if (d <= MERGE_DISTANCE) {

                mergeOnes(
                    oneA,
                    oneB
                );

                return;
            }
        }
    }
}


/* =================================================
   CREATE READ OBJECT
================================================= */

function createKnowledge(
    px,
    py
) {

    /* Only one READ entry point exists per game session. */
    if (readObjects.length > 0) {
        return;
    }

    /*
        READ is a gameplay object, not part of the reader
        overlay. Give it a dedicated layer immediately.
    */

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "knowledge";

    element.style.zIndex =
        "3000";

    element.textContent =
        "READ";

    document.body.appendChild(
        element
    );


    const knowledge = {

        x: px,
        y: py,

        targetX: px,
        targetY: py,

        element: element,

        dragging: false,

        moved: false,

        downX: 0,

        downY: 0
    };


    readObjects.push(
        knowledge
    );


    element.addEventListener(
        "pointerdown",
        function(e) {

            e.preventDefault();

            e.stopPropagation();

            knowledge.dragging =
                true;

            knowledge.moved =
                false;

            knowledge.downX =
                e.clientX;

            knowledge.downY =
                e.clientY;

            try {

                element.setPointerCapture(
                    e.pointerId
                );

            } catch (_) {}

        }
    );


    element.addEventListener(
        "pointermove",
        function(e) {

            if (
                !knowledge.dragging
            ) {

                return;
            }

            e.preventDefault();

            e.stopPropagation();


            if (
                distance(
                    e.clientX,
                    e.clientY,
                    knowledge.downX,
                    knowledge.downY
                ) > 8
            ) {

                knowledge.moved =
                    true;
            }


            knowledge.targetX =
                e.clientX;

            knowledge.targetY =
                e.clientY;
        }
    );


    const end =
        function(e) {

            if (
                !knowledge.dragging
            ) {

                return;
            }

            e.preventDefault();

            e.stopPropagation();

            knowledge.dragging =
                false;


            if (
                !knowledge.moved
            ) {

                openPrologue();
            }
        };


    element.addEventListener(
        "pointerup",
        end
    );


    element.addEventListener(
        "pointercancel",
        function(e) {

            e.stopPropagation();

            knowledge.dragging =
                false;
        }
    );


    updateKnowledge(
        knowledge
    );
}


/* =================================================
   UPDATE READ OBJECT
================================================= */

function updateKnowledge(
    knowledge
) {

    knowledge.x +=
        (
            knowledge.targetX -
            knowledge.x
        ) * 0.10;

    knowledge.y +=
        (
            knowledge.targetY -
            knowledge.y
        ) * 0.10;


    const r = 34;


    knowledge.x =
        Math.max(
            r,
            Math.min(
                window.innerWidth - r,
                knowledge.x
            )
        );


    knowledge.y =
        Math.max(
            r,
            Math.min(
                window.innerHeight - r,
                knowledge.y
            )
        );


    knowledge.element.style.left =
        knowledge.x + "px";

    knowledge.element.style.top =
        knowledge.y + "px";
}


/* =================================================
   POINTER DOWN
================================================= */

function pointerDown(
    px,
    py
) {

    const now =
        Date.now();


    const closest =
        findClosestOne(
            px,
            py
        );


    if (!closest) {

        lastTap = 0;

        lastTappedOne = null;

        return;
    }


    if (
        now - lastTap <
        DOUBLE_TAP_TIME &&
        lastTappedOne === closest
    ) {

        splitOne(
            closest
        );


        lastTap = 0;

        lastTappedOne = null;

        return;
    }


    lastTap = now;

    lastTappedOne =
        closest;


    selectedOne =
        closest;


    growing = true;


    selectedOne.targetX =
        px;

    selectedOne.targetY =
        py;
}


/* =================================================
   POINTER MOVE
================================================= */

function pointerMove(
    px,
    py
) {

    if (!growing) {

        return;
    }


    if (!selectedOne) {

        return;
    }


    selectedOne.targetX =
        px;

    selectedOne.targetY =
        py;
}


/* =================================================
   POINTER UP
================================================= */

function pointerUp() {

    growing = false;
}

/* =================================================
   FORMAT TIME
================================================= */

function formatTime(
    seconds
) {

    const s =
        Math.max(
            0,
            Math.floor(seconds)
        );


    return String(
        Math.floor(
            s / 60
        )
    ).padStart(
        2,
        "0"
    )
    +
    ":"
    +
    String(
        s % 60
    ).padStart(
        2,
        "0"
    );
}

/* =================================================
   OPEN READER
================================================= */

function normalizeSourceText(sourceText) {

    let normalizedText =
        String(sourceText || "")
            .replace(/\r\n/g, "\n");

    const startMarker =
        normalizedText.indexOf(
            "*** START OF THE PROJECT GUTENBERG EBOOK"
        );

    const endMarker =
        normalizedText.indexOf(
            "*** END OF THE PROJECT GUTENBERG EBOOK"
        );

    if (
        startMarker >= 0 &&
        endMarker > startMarker
    ) {
        normalizedText =
            normalizedText
                .slice(
                    normalizedText.indexOf("\n", startMarker) + 1,
                    endMarker
                )
                .trim();
    }

    return normalizedText.trim();
}


function selectFifteenMinuteText(
    sourceText,
    targetWords,
    startMarker = ""
) {

    let normalizedText =
        normalizeSourceText(sourceText);

    if (!normalizedText) {
        return "";
    }

    const marker =
        String(startMarker || "").trim();

    if (marker) {
        const markerIndex =
            normalizedText.indexOf(marker);

        if (markerIndex >= 0) {
            normalizedText =
                normalizedText
                    .slice(markerIndex)
                    .trim();
        }
    }

    const words =
        [...normalizedText.matchAll(/\S+/g)];

    const limit =
        Math.max(
            1,
            Number(targetWords) || 2700
        );

    if (
        words.length <= limit
    ) {
        return normalizedText;
    }

    const lastWord =
        words[limit - 1];

    return normalizedText
        .slice(
            0,
            lastWord.index +
            lastWord[0].length
        )
        .trim();
}


function renderReaderText(sourceText) {
    const raw = String(sourceText || "").replace(/\r\n/g, "\n").trim();
    readerText.replaceChildren();
    if (!raw) return;
    const blocks = raw.split(/\n[ \t]*\n+/);
    const fragment = document.createDocumentFragment();
    for (const block of blocks) {
        const text = block.replace(/\n+/g, " ").replace(/[ \t]+/g, " ").trim();
        if (!text) continue;
        const el = document.createElement("div");
        el.className = "reader-block";
        if (/^(chapter|part|book|preface|introduction|contents|epilogue|prologue|section)\b/i.test(text) || (text.length < 90 && !/[.!?]$/.test(text))) el.classList.add("reader-heading");
        el.textContent = text;
        fragment.appendChild(el);
    }
    readerText.appendChild(fragment);
}
function estimateFullBookSeconds(sourceText) {
    const words = String(sourceText || "").match(/\S+/g)?.length || 0;
    return Math.max(60, Math.ceil((words / FULL_BOOK_WORDS_PER_MINUTE) * 60));
}

async function loadSourceTextForReader(
    book,
    openToken
) {

    if (
        book.fullText &&
        String(book.fullText).trim()
    ) {
        return normalizeSourceText(
            book.fullText
        );
    }

    /*
        SOURCE CONTRACT:
        book.fifteenMinuteText is the calibrated 15-minute source selection.
        book.text is legacy-compatible source selection only when present.
        Neither is eligible as a FULL BOOK source.
    */

    if (
        !book.fullTextUrl
    ) {
        return "";
    }

    const sourceUrl =
        new URL(
            book.fullTextUrl,
            document.baseURI
        ).href;

    const response =
        await fetch(
            sourceUrl,
            {
                cache: "no-store"
            }
        );

    if (
        !response.ok
    ) {
        throw new Error(
            "Full text request failed"
        );
    }

    const sourceText =
        await response.text();

    if (
        sourceText.trim().length < 1000
    ) {
        throw new Error(
            "Full text is unexpectedly short"
        );
    }

    if (
        openToken !== readerOpenToken
    ) {
        return "";
    }

    const normalizedText =
        normalizeSourceText(
            sourceText
        );

    book.fullText =
        normalizedText;

    return normalizedText;
}


async function openReader(modeOverride) {

    stopReaderAnimation();

    const openToken = ++readerOpenToken;

    if (modeOverride === "15" || modeOverride === "full") {
        readingMode = modeOverride;
    }


    currentBook =
        window.CICAN_ACTIVE_BOOK ||
        BOOK_READ;

    if (!currentBook) {
        return;
    }


    readerPaused =
        false;


    readerComplete =
        false;


    readerSeconds =
        TARGET_READING_SECONDS;


    /*
        RENDER THE ENTIRE BOOK.

        No word-by-word progression.
        No chunks.
        No typing effect.
    */

    const requestedMode = readingMode;
    const requestedBook = currentBook;
    const isFullBook = requestedMode === "full";

    /*
        15 MIN is source text only.
        Never fall back to a CICAN-written summary.

        IMPORTANT:
        fullTextUrl is a LOCATION, not the source text itself.
        Never display the path as reader content.
    */
    if (!isFullBook) {
        const fifteenValue = String(
            currentBook.fifteenMinuteText || ""
        ).trim();
        const fullPath = String(
            currentBook.fullTextUrl || ""
        ).trim();

        /*
            Guard against stale/cached book modules that may have
            populated fifteenMinuteText with the asset path itself.
            That value is metadata, never reader text.
        */
        if (
            fifteenValue &&
            fullPath &&
            fifteenValue === fullPath
        ) {
            currentBook.fifteenMinuteText = "";
        }
    }

    if (
        !isFullBook &&
        !currentBook.fifteenMinuteText &&
        currentBook.fullText &&
        String(currentBook.fullText).trim()
    ) {
        currentBook.fifteenMinuteText =
            selectFifteenMinuteText(
                currentBook.fullText,
                currentBook.targetWords,
                currentBook.fifteenMinuteStartMarker
            );
    }

    if (
        !isFullBook &&
        !currentBook.fifteenMinuteText
    ) {

        fullTextLoading = true;
        readerModeNote.textContent =
            "LOADING SOURCE TEXT";

        try {

            const sourceText =
                await loadSourceTextForReader(
                    currentBook,
                    openToken
                );

            if (
                openToken !== readerOpenToken ||
                readingMode !== requestedMode ||
                currentBook !== requestedBook
            ) {
                fullTextLoading = false;
                return;
            }

            if (
                sourceText
            ) {
                currentBook.fifteenMinuteText =
                    selectFifteenMinuteText(
                        sourceText,
                        currentBook.targetWords,
                        currentBook.fifteenMinuteStartMarker
                    );
            }

            if (
                !currentBook.fifteenMinuteText
            ) {
                throw new Error(
                    "15-minute source text unavailable"
                );
            }

        } catch (_) {

            if (
                openToken !== readerOpenToken ||
                readingMode !== requestedMode ||
                currentBook !== requestedBook
            ) {
                fullTextLoading = false;
                return;
            }

            fullTextLoading = false;
            readerModeNote.textContent =
                "15-MINUTE SOURCE TEXT NOT YET AVAILABLE FOR THIS EDITION";
            updateReaderModeUI();
            return;
        }

        fullTextLoading = false;
    }


    if (
        isFullBook &&
        !currentBook.fullText
    ) {
        /*
            Prefer a dedicated full-text asset when one exists.
            Otherwise use the book's canonical text already loaded
            in the book record.
        */
        if (!currentBook.fullTextUrl) {
            readerModeNote.textContent = "FULL BOOK SOURCE NOT AVAILABLE FOR THIS EDITION";
            updateReaderModeUI();
            return;
        } else {
            fullTextLoading = true;
            modeFull.disabled = true;
            readerModeNote.textContent = "LOADING FULL BOOK";
            try {
                const response = await fetch(currentBook.fullTextUrl, { cache: "no-store" });
                if (!response.ok) throw new Error("Full text request failed");
                const sourceText = await response.text();
                if (sourceText.trim().length < 1000) throw new Error("Full text is unexpectedly short");

                let normalizedText = sourceText.replace(/\\r\\n/g, "\\n");

                /*
                    Project Gutenberg full-text files contain a license
                    wrapper around the actual book. For FULL BOOK, keep
                    the complete book itself while excluding that wrapper.
                */
                const startMarker = normalizedText.indexOf("*** START OF THE PROJECT GUTENBERG EBOOK");
                const endMarker = normalizedText.indexOf("*** END OF THE PROJECT GUTENBERG EBOOK");

                if (startMarker >= 0 && endMarker > startMarker) {
                    normalizedText = normalizedText
                        .slice(normalizedText.indexOf("\\n", startMarker) + 1, endMarker)
                        .trim();
                }

                if (
                    openToken !== readerOpenToken ||
                    readingMode !== requestedMode ||
                    currentBook !== requestedBook
                ) {
                    requestedBook.fullText = normalizedText;
                    fullTextLoading = false;
                    return;
                }

                currentBook.fullText = normalizedText;
                currentBook.fullTextResolved = true;
            } catch (_) {
                if (
                    openToken !== readerOpenToken ||
                    readingMode !== requestedMode ||
                    currentBook !== requestedBook
                ) {
                    fullTextLoading = false;
                    return;
                }

                fullTextLoading = false;
                updateReaderModeUI();
                readerModeNote.textContent = "FULL BOOK COULD NOT BE LOADED";
                return;
            }
            fullTextLoading = false;
        }
    }

    const fullAvailable = !!(
        currentBook &&
        (
            currentBook.fullText ||
            currentBook.fullTextUrl
        )
    );

    const fifteenAvailable = !!(
        currentBook &&
        currentBook.fifteenMinuteText
    );

    if (
        !isFullBook &&
        !fifteenAvailable
    ) {
        readerModeNote.textContent =
            "15-MINUTE SOURCE TEXT NOT YET AVAILABLE FOR THIS EDITION";
        return;
    }

    if (
        isFullBook &&
        !fullAvailable
    ) {
        readerModeNote.textContent =
            "FULL BOOK NOT YET LOADED FOR THIS EDITION";
        return;
    }

    const activeReaderSource =
        isFullBook
            ? currentBook.fullText
            : currentBook.fifteenMinuteText;

    renderReaderText(activeReaderSource);

    readerScrollPosition = loadReaderPosition();

    const savedProgress =
        Math.max(
            0,
            Math.min(
                1,
                readerScrollPosition /
                Math.max(
                    1,
                    readerText.scrollHeight -
                    readerText.clientHeight
                )
            )
        );

    readerTotalSeconds =
        isFullBook
            ? estimateFullBookSeconds(currentBook.fullText)
            : TARGET_READING_SECONDS;

    readerSeconds =
        Math.max(
            0,
            readerTotalSeconds * (1 - savedProgress)
        );

    readerModeNote.textContent =
        isFullBook
            ? "FULL BOOK • AUTO-READING"
            : (
                savedProgress > 0.01
                    ? "CONTINUING FROM " +
                      Math.floor(savedProgress * 100) +
                      "%"
                    : "15-MINUTE SOURCE TEXT"
            );

    mode15.classList.toggle("active", readingMode === "15");
    modeFull.classList.toggle("active", readingMode === "full");
    modeFull.disabled = !fullAvailable;
    document.getElementById("readerTimer").textContent =
        formatTime(readerSeconds);

    readerPause.style.display = "";
    readerPause.textContent = "PAUSE";


    readerStatus.textContent =
        isFullBook && fullAvailable ? "FULL BOOK • AUTO-READING" : "AUTO-READING";


    reader.classList.add(
        "open"
    );
    document.body.classList.add("reader-open");

    restoreHUDPosition();


    /*
        Allow the browser to calculate
        the complete text height before
        starting the fluid movement.
    */

    requestAnimationFrame(
        function() {

            const availableScroll =
                Math.max(
                    0,
                    readerText.scrollHeight -
                    readerText.clientHeight
                );

            readerScrollPosition =
                Math.min(
                    Math.max(0, readerScrollPosition),
                    availableScroll
                );

            readerText.scrollTop =
                readerScrollPosition;

            readerLastTime =
                performance.now();

            updateReaderUI();


            readerAnimation =
                requestAnimationFrame(
                    fluidAutoReader
                );
        }
    );
}


/* =================================================
   FLUID AUTO READER
================================================= */

function fluidAutoReader(now) {

    if (
        readerComplete
    ) {

        return;
    }


    /*
        Calculate real frame time.
    */

    const delta =
        Math.min(
            0.05,
            (
                now -
                readerLastTime
            ) / 1000
        );


    readerLastTime =
        now;


    /*
        PAUSED
    */

    if (
        readerPaused
    ) {

        readerAnimation =
            requestAnimationFrame(
                fluidAutoReader
            );

        return;
    }


    const maxScroll =
        Math.max(
            0,
            readerText.scrollHeight -
            readerText.clientHeight
        );


    /*
        Nothing to scroll.
    */

    if (
        maxScroll <= 0
    ) {

        finishReader();

        return;
    }


    /*
        CONSTANT FLUID SPEED.

        Complete scroll distance is
        divided across this book's configured
        15-minute target duration.
    */

    const pixelsPerSecond =
        maxScroll /
        Math.max(60, readerTotalSeconds);


    readerScrollPosition +=
        pixelsPerSecond *
        delta;

    if (
        now - lastReaderSaveTime >
        2000
    ) {
        saveReaderPosition(now);
    }


    readerScrollPosition =
        Math.min(
            maxScroll,
            readerScrollPosition
        );


    readerText.scrollTop =
        readerScrollPosition;


    /*
        Calculate progress directly
        from physical reading position.
    */

    const progress =
        readerScrollPosition /
        maxScroll;


    readerSeconds =
        Math.max(
            0,
            (
                readerTotalSeconds *
                (1 - progress)
            )
        );


    updateReaderUI();


    /*
        END
    */

    if (
        readerScrollPosition >=
        maxScroll - 1
    ) {

        finishReader();

        return;
    }


    /*
        CONTINUE EVERY FRAME
    */

    readerAnimation =
        requestAnimationFrame(
            fluidAutoReader
        );
}


/* =================================================
   FINISH READER
================================================= */

function readerPositionKey() {
    if (!window.CICAN_ACTIVE_BOOK_ID) return null;
    return READER_STATE_PREFIX + window.CICAN_ACTIVE_BOOK_ID + ":" + readingMode;
}

function loadReaderPosition() {
    const key = readerPositionKey();
    if (!key) return 0;
    try {
        const value = Number(localStorage.getItem(key));
        return Number.isFinite(value) && value >= 0 ? value : 0;
    } catch (_) {
        return 0;
    }
}

function saveReaderPosition(now) {

    if (
        !currentBook ||
        !window.CICAN_ACTIVE_BOOK_ID
    ) {
        return;
    }

    try {
        localStorage.setItem(
            READER_STATE_PREFIX +
            window.CICAN_ACTIVE_BOOK_ID +
            ":" +
            readingMode,
            String(
                Math.max(
                    0,
                    readerScrollPosition
                )
            )
        );
        lastReaderSaveTime =
            now || performance.now();
    } catch (_) {}
}


function clearReaderPosition() {

    if (!window.CICAN_ACTIVE_BOOK_ID) {
        return;
    }

    try {
        localStorage.removeItem(
            READER_STATE_PREFIX +
            window.CICAN_ACTIVE_BOOK_ID +
            ":" +
            readingMode
        );
    } catch (_) {}
}


function finishReader() {

    if (
        readerComplete
    ) {

        return;
    }


    readerComplete =
        true;


    stopReaderAnimation();


    /*
        Put reader exactly at the end.
    */

    readerText.scrollTop =
        readerText.scrollHeight;


    readerScrollPosition =
        Math.max(
            0,
            readerText.scrollHeight -
            readerText.clientHeight
        );


    // Persist the exact completed position so a lifecycle interruption
    // cannot restore the reader to an earlier point.
    saveReaderPosition(performance.now());


    readerSeconds =
        0;


    document.getElementById(
        "readerTimer"
    ).textContent =
        "00:00";


    document.getElementById(
        "readerPercent"
    ).textContent =
        "100%";


    readerStatus.textContent =
        "COMPLETE";


    readerPause.textContent =
        "READ AGAIN";
}


/* =================================================
   PAUSE / RESUME
================================================= */

mode15.addEventListener("pointerdown", function(e) {
    e.preventDefault();
    if (!currentBook) return;

    readingMode = "15";
    saveReaderMode();
    openReader("15");
});

modeFull.addEventListener("pointerdown", async function(e) {
    e.preventDefault();
    if (!currentBook || fullTextLoading) return;

    readingMode = "full";
    saveReaderMode();
    await openReader("full");
});

readerText.addEventListener("scroll", function() {
    if (readingMode !== "full") return;
    readerScrollPosition = readerText.scrollTop;
    updateReaderUI();
    const maxScroll = Math.max(0, readerText.scrollHeight - readerText.clientHeight);
    readerStatus.textContent = maxScroll > 0 && readerScrollPosition >= maxScroll - 2 ? "COMPLETE" : "FULL BOOK";
    const now = performance.now();
    if (now - lastReaderSaveTime > 700) saveReaderPosition(now);
});

readerPause.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();


        if (
            !currentBook
        ) {

            return;
        }


        /*
            COMPLETE → READ AGAIN
        */

        if (
            readerComplete
        ) {

            clearReaderPosition();

            openReader();

            return;
        }


        /*
            PAUSE
        */

        if (
            !readerPaused
        ) {

            readerPaused =
                true;


            readerPause.textContent =
                "RESUME";


            readerStatus.textContent =
                "PAUSED";


            return;
        }


        /*
            RESUME
        */

        readerPaused =
            false;


        readerLastTime =
            performance.now();


        readerPause.textContent =
            "PAUSE";


        readerStatus.textContent =
            "AUTO-READING";
    }
);


/* =================================================
   CLOSE READER
================================================= */

function closeReader() {

    readerOpenToken += 1;

    saveReaderPosition(
        performance.now()
    );

    stopReaderAnimation();


    readerPaused =
        false;


    readerComplete =
        false;


    readerSeconds =
        TARGET_READING_SECONDS;


    readerScrollPosition =
        0;


    readerText.textContent =
        "";


    readerText.scrollTop =
        0;


    reader.classList.remove(
        "open"
    );
    document.body.classList.remove("reader-open");


    readerPause.textContent =
        "PAUSE";


    readerStatus.textContent =
        "AUTO-READING";
}


/* =================================================
   READER CLOSE BUTTON
================================================= */

readerClose.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();

        closeReader();
    }
);


/* =================================================
   READER LIFECYCLE PERSISTENCE
================================================= */

function persistReaderLifecycleState() {
    if (!reader.classList.contains("open") || !currentBook) return;
    saveReaderPosition(performance.now());
}

window.addEventListener("pagehide", persistReaderLifecycleState);
window.addEventListener("beforeunload", persistReaderLifecycleState);
document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "hidden") {
        persistReaderLifecycleState();
    }
});


/* =================================================
   READER EVENT PROTECTION
================================================= */

reader.addEventListener(
    "pointerdown",
    function(e) {

        e.stopPropagation();
    }
);


reader.addEventListener(
    "pointermove",
    function(e) {

        e.stopPropagation();
    }
);


reader.addEventListener(
    "pointerup",
    function(e) {

        e.stopPropagation();
    }
);


reader.addEventListener(
    "pointercancel",
    function(e) {

        e.stopPropagation();
    }
);


/* =================================================
   SMALL MOVABLE TIMER
================================================= */

const readerHUD =
    document.getElementById(
        "readerHUD"
    );

const readerPanel =
    document.querySelector(
        ".reader-panel"
    );

let hudDragging = false;

let hudPointerId = null;

let hudOffsetX = 0;

let hudOffsetY = 0;


readerHUD.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();


        hudDragging = true;

        hudPointerId =
            e.pointerId;


        const hudRect =
            readerHUD.getBoundingClientRect();


        hudOffsetX =
            e.clientX -
            hudRect.left;


        hudOffsetY =
            e.clientY -
            hudRect.top;


        readerHUD.classList.add(
            "dragging"
        );


        try {

            readerHUD.setPointerCapture(
                e.pointerId
            );

        } catch (_) {}
    },
    {
        passive: false
    }
);


readerHUD.addEventListener(
    "pointermove",
    function(e) {

        if (
            !hudDragging ||
            e.pointerId !== hudPointerId
        ) {
            return;
        }


        e.preventDefault();

        e.stopPropagation();


        const panelRect =
            readerPanel.getBoundingClientRect();

        const hudRect =
            readerHUD.getBoundingClientRect();


        const padding =
            6;


        let left =
            e.clientX -
            panelRect.left -
            hudOffsetX;


        let top =
            e.clientY -
            panelRect.top -
            hudOffsetY;


        const maxLeft =
            Math.max(
                padding,
                panelRect.width -
                hudRect.width -
                padding
            );


        const maxTop =
            Math.max(
                padding,
                panelRect.height -
                hudRect.height -
                padding
            );


        left =
            Math.max(
                padding,
                Math.min(
                    maxLeft,
                    left
                )
            );


        top =
            Math.max(
                padding,
                Math.min(
                    maxTop,
                    top
                )
            );


        readerHUD.style.left =
            left + "px";


        readerHUD.style.top =
            top + "px";


        readerHUD.style.right =
            "auto";


        readerHUD.style.bottom =
            "auto";
    },
    {
        passive: false
    }
);


function saveHUDPosition() {
    if (!window.CICAN_ACTIVE_BOOK_ID) return;
    if (!readerHUD.style.left || !readerHUD.style.top) return;
    try {
        localStorage.setItem(
            "cican_reader_hud:" + window.CICAN_ACTIVE_BOOK_ID,
            JSON.stringify({
                left: readerHUD.style.left,
                top: readerHUD.style.top
            })
        );
    } catch (_) {}
}


function restoreHUDPosition() {
    if (!window.CICAN_ACTIVE_BOOK_ID) return;
    try {
        const saved = localStorage.getItem(
            "cican_reader_hud:" + window.CICAN_ACTIVE_BOOK_ID
        );
        if (!saved) return;
        const position = JSON.parse(saved);
        if (position && position.left && position.top) {
            readerHUD.style.left = position.left;
            readerHUD.style.top = position.top;
            readerHUD.style.right = "auto";
            readerHUD.style.bottom = "auto";
        }
    } catch (_) {}
}


function endHUDDrag(e) {

    if (!hudDragging) {
        return;
    }


    if (
        e &&
        e.pointerId !== hudPointerId
    ) {
        return;
    }


    if (e) {

        e.preventDefault();

        e.stopPropagation();
    }


    hudDragging =
        false;


    readerHUD.classList.remove(
        "dragging"
    );

    saveHUDPosition();


    try {

        readerHUD.releasePointerCapture(
            hudPointerId
        );

    } catch (_) {}


    hudPointerId =
        null;
}


readerHUD.addEventListener(
    "pointerup",
    endHUDDrag,
    {
        passive: false
    }
);


readerHUD.addEventListener(
    "pointercancel",
    endHUDDrag,
    {
        passive: false
    }
);


/* =================================================
   KEEP HUD INSIDE READER
================================================= */

window.addEventListener(
    "resize",
    function() {

        if (
            !readerHUD.style.left
        ) {
            return;
        }


        const panelRect =
            readerPanel.getBoundingClientRect();

        const hudRect =
            readerHUD.getBoundingClientRect();


        const padding =
            6;


        let left =
            parseFloat(
                readerHUD.style.left
            );


        let top =
            parseFloat(
                readerHUD.style.top
            );


        if (
            !Number.isFinite(left)
        ) {
            left = padding;
        }


        if (
            !Number.isFinite(top)
        ) {
            top = padding;
        }


        const maxLeft =
            Math.max(
                padding,
                panelRect.width -
                hudRect.width -
                padding
            );


        const maxTop =
            Math.max(
                padding,
                panelRect.height -
                hudRect.height -
                padding
            );


        left =
            Math.max(
                padding,
                Math.min(
                    maxLeft,
                    left
                )
            );


        top =
            Math.max(
                padding,
                Math.min(
                    maxTop,
                    top
                )
            );


        readerHUD.style.left =
            left + "px";


        readerHUD.style.top =
            top + "px";
    }
);


/* =================================================
   READER VIEWPORT RESILIENCE
================================================= */

let readerResizeFrame = null;

window.addEventListener("resize", function() {
    if (!reader.classList.contains("open") || !currentBook) return;

    const previousMaxScroll = Math.max(
        0,
        readerText.scrollHeight - readerText.clientHeight
    );

    const previousPosition = Math.max(
        0,
        Math.min(readerText.scrollTop, previousMaxScroll)
    );

    const progress = previousMaxScroll > 0
        ? previousPosition / previousMaxScroll
        : 0;

    if (readerResizeFrame !== null) {
        cancelAnimationFrame(readerResizeFrame);
    }

    readerResizeFrame = requestAnimationFrame(function() {
        readerResizeFrame = null;

        const nextMaxScroll = Math.max(
            0,
            readerText.scrollHeight - readerText.clientHeight
        );

        readerScrollPosition = Math.min(
            Math.max(0, nextMaxScroll * progress),
            nextMaxScroll
        );

        readerText.scrollTop = readerScrollPosition;
        updateReaderUI();
        saveReaderPosition(performance.now());
    });
});


/* =================================================
   ESCAPE
================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key !== "Escape"
        ) {

            return;
        }


        if (
            reader.classList.contains(
                "open"
            )
        ) {

            closeReader();

            return;
        }


        if (
            prologue.classList.contains(
                "open"
            )
        ) {

            closePrologue();
        }
    }
);


/* =================================================
   RESET
================================================= */

function resetGame() {

    closeReader();

    closePrologue();


    /*
        REMOVE CICAN
    */

    for (
        const one of ones
    ) {

        one.element.remove();
    }


    ones = [];


    /*
        REMOVE READ OBJECTS
    */

    for (
        const knowledge of readObjects
    ) {

        knowledge.element.remove();
    }


    readObjects = [];


    /*
        REMOVE TRAILS
    */

    document
        .querySelectorAll(
            ".trail"
        )
        .forEach(
            element =>
                element.remove()
        );


    /*
        RESET CONTROL
    */

    selectedOne =
        createOne(
            window.innerWidth / 2,
            window.innerHeight / 2,
            MIN_SIZE,
            false
        );


    growing = false;

    lastTap = 0;

    lastTappedOne = null;
}


/* =================================================
   RESET BUTTON
================================================= */

const resetButton =
    document.getElementById(
        "reset"
    );


resetButton.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();

        window.location.href = "index.html";
    }
);


/* =================================================
   START
================================================= */

selectedOne =
    createOne(
        window.innerWidth / 2,
        window.innerHeight / 2,
        MIN_SIZE,
        false
    );


/*
    Book-specific visuals are optional layers.
    Failure here must never disable the canonical game.
*/
try {


        createDhammapadaThoughts();

        dhammaLastX =
            selectedOne.x;

        dhammaLastY =
            selectedOne.y;
    }


        createTaoFlows();

        taoLastX =
            selectedOne.x;

        taoLastY =
            selectedOne.y;
    }

} catch (bookExperienceError) {

    console.error(
        "CICAN book-specific setup error:",
        bookExperienceError
    );

}


/* =================================================
   MAIN LOOP
================================================= */

function animate() {

    /*
        ORIGINAL V13 FLUID MOVEMENT.

        x += (targetX - x) * 0.10
        y += (targetY - y) * 0.10

        PRESERVED.
    */

    for (
        const one of ones
    ) {

        one.x +=
            (
                one.targetX -
                one.x
            ) * 0.10;


        one.y +=
            (
                one.targetY -
                one.y
            ) * 0.10;


        /*
            ONLY SELECTED CICAN
            GROWS.
        */

        if (
            growing &&
            selectedOne === one
        ) {

            one.size += 0.5;


            if (
                one.size >
                MAX_SIZE
            ) {

                one.size =
                    MAX_SIZE;
            }
        }


        /*
            TRAIL.
        */

        if (
            distance(
                one.x,
                one.y,
                one.lastTrailX,
                one.lastTrailY
            ) >=
            TRAIL_DISTANCE
        ) {

            createTrail(
                one.x,
                one.y
            );


            one.lastTrailX =
                one.x;

            one.lastTrailY =
                one.y;
        }


        updateOne(one);
    }


    /*
        MERGE IS THE ONLY
        INTERACTION BETWEEN
        TWO CICAN.
    */

    checkForMerges();


    /*
        UPDATE READ OBJECTS.
    */

    for (
        const knowledge of readObjects
    ) {

        updateKnowledge(
            knowledge
        );
    }


    requestAnimationFrame(
        animate
    );

}


updateReaderModeUI();


animate();


}


startCicanBook().catch(function(error) {

    console.error(
        "CICAN book loading error:",
        error
    );

    document.getElementById(
        "subtitle"
    ).textContent =
        "BOOK COULD NOT LOAD";
});


</script>
