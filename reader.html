<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>CICAN BOOKS — Reader</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
.shell{min-height:100vh;display:flex;flex-direction:column}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.brand{color:#fff;text-decoration:none;font-size:16px;font-weight:900;letter-spacing:-.05em}
.back{color:rgba(255,255,255,.5);text-decoration:none;font-size:9px;font-weight:800;letter-spacing:.18em}
.reader{width:min(100%,860px);margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0;padding:24px 20px 18px}
.eyebrow{color:rgba(255,255,255,.38);font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
h1{margin-top:8px;font-size:clamp(23px,5vw,36px);line-height:1.12;letter-spacing:-.035em}
.modes{display:flex;gap:7px;margin:18px auto 10px;width:min(100%,390px)}
.mode,.control{flex:1;min-height:38px;border:1px solid rgba(255,255,255,.16);border-radius:20px;background:#080808;color:rgba(255,255,255,.58);font-size:9px;font-weight:900;letter-spacing:.13em;cursor:pointer}
.mode.active{background:#fff;color:#000;border-color:#fff}
.progress{height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.fill{width:0;height:100%;background:#fff}
.status{height:28px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.34);font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.text{flex:1;min-height:0;overflow-y:auto;padding:18px 8px 120px;scroll-behavior:auto;font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;font-size:clamp(17px,2.2vw,21px);line-height:1.82;color:rgba(255,255,255,.94);white-space:pre-wrap;overflow-wrap:anywhere;-webkit-overflow-scrolling:touch}
.text::-webkit-scrollbar{width:5px}.text::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:8px}
.bottom{display:flex;gap:8px;position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(94vw,390px);z-index:5}
.control{background:rgba(0,0,0,.92);border-color:rgba(255,255,255,.22);backdrop-filter:blur(8px)}
.control.primary{background:#fff;color:#000;border-color:#fff}
.control:active,.mode:active{transform:scale(.98)}
.error{display:none;align-items:center;justify-content:center;min-height:50vh;color:rgba(255,255,255,.6);text-align:center;font-size:12px;line-height:1.7}
@media(max-width:600px){.reader{padding:18px 14px 12px}.top{height:54px;padding:0 14px}.text{padding:14px 4px 120px;font-size:17px;line-height:1.76}h1{font-size:24px}.modes{margin-top:15px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><a class="brand" href="index.html">CICAN</a><a class="back" href="index.html">BOOKS</a></header>
<main class="reader">
<div class="eyebrow" id="eyebrow">CICAN READER</div>
<h1 id="title">Loading…</h1>
<div class="modes" role="tablist" aria-label="Reading mode">
<button id="mode15" class="mode active" type="button">15 MIN</button>
<button id="modeFull" class="mode" type="button">FULL BOOK</button>
</div>
<div class="progress"><div id="fill" class="fill"></div></div>
<div id="status" class="status">LOADING</div>
<article id="text" class="text" tabindex="0"></article>
<div id="error" class="error">This book could not be opened.<br><br><a href="index.html" style="color:#fff">RETURN TO BOOKS</a></div>
</main>
<div class="bottom">
<button id="pause" class="control primary" type="button">PAUSE</button>
<button id="fullscreen" class="control" type="button">FULL SCREEN</button>
</div>
</div>
<script type="module">
import { loadBook } from "./engine/book-loader.js?v=18.25";

const params = new URLSearchParams(location.search);
const id = params.get("book");
const titleEl = document.getElementById("title");
const textEl = document.getElementById("text");
const statusEl = document.getElementById("status");
const fillEl = document.getElementById("fill");
const errorEl = document.getElementById("error");
const mode15 = document.getElementById("mode15");
const modeFull = document.getElementById("modeFull");
const pauseBtn = document.getElementById("pause");
const fullscreenBtn = document.getElementById("fullscreen");

let book = null;
let mode = "15";
let paused = false;
let started = false;
let startTime = 0;
let elapsedBeforePause = 0;
let duration = 900;
let animationFrame = 0;
let sourceText = "";
let currentText = "";

const WPM = 100;

function wordCount(text){ return (String(text||"").trim().match(/\S+/g)||[]).length; }
function fullSeconds(text){ return Math.max(900, Math.ceil(wordCount(text)/WPM*60)); }
function setStatus(s){ statusEl.textContent=s; }
function setText(text){
  currentText=String(text||"").trim();
  textEl.textContent=currentText;
  textEl.scrollTop=0;
  fillEl.style.width="0%";
}
function stop(){
  cancelAnimationFrame(animationFrame);
  animationFrame=0;
}
function elapsed(){
  return elapsedBeforePause + (paused ? 0 : (performance.now()-startTime)/1000);
}
function tick(now){
  if(!started || paused) return;
  const e=Math.max(0,Math.min(duration,(now-startTime)/1000+elapsedBeforePause));
  const ratio=duration ? e/duration : 0;
  const max=textEl.scrollHeight-textEl.clientHeight;
  textEl.scrollTop=Math.max(0,max*ratio);
  fillEl.style.width=(ratio*100).toFixed(2)+"%";
  if(e>=duration){ paused=true; pauseBtn.textContent="REPLAY"; setStatus("COMPLETE"); return; }
  animationFrame=requestAnimationFrame(tick);
}
function start(){
  stop();
  if(!currentText){setStatus("NO TEXT");return;}
  paused=false; started=true; elapsedBeforePause=0; startTime=performance.now();
  pauseBtn.textContent="PAUSE"; setStatus(mode==="15"?"AUTO-READING · 15 MIN":"AUTO-READING · FULL BOOK");
  requestAnimationFrame(tick);
}
function pause(){
  if(!started){start();return;}
  if(!paused){
    elapsedBeforePause=Math.min(duration,elapsed());
    paused=true; stop(); pauseBtn.textContent="RESUME"; setStatus("PAUSED");
  }else{
    if(elapsedBeforePause>=duration){textEl.scrollTop=0;fillEl.style.width="0%";elapsedBeforePause=0;}
    paused=false; startTime=performance.now(); pauseBtn.textContent="PAUSE"; setStatus(mode==="15"?"AUTO-READING · 15 MIN":"AUTO-READING · FULL BOOK"); requestAnimationFrame(tick);
  }
}
async function setMode(next){
  if(!book) return;
  mode=next;
  mode15.classList.toggle("active",mode==="15");
  modeFull.classList.toggle("active",mode==="full");
  stop(); paused=false; started=false; elapsedBeforePause=0; textEl.scrollTop=0;
  if(mode==="15"){
    sourceText=book.fifteenMinuteText||"";
    duration=Math.max(60,Number(book.targetMinutes||15)*60);
    setText(sourceText); setStatus("15 MINUTES");
  }else{
    setStatus("LOADING FULL BOOK");
    try{
      if(book.fullText && String(book.fullText).trim()) sourceText=book.fullText;
      else if(book.fullTextUrl){
        const res=await fetch(new URL(book.fullTextUrl,document.baseURI).href,{cache:"no-store"});
        if(!res.ok) throw new Error("Full book source unavailable");
        sourceText=await res.text();
      }else throw new Error("No full book source");
      if(wordCount(sourceText)<500) throw new Error("Full book source is unexpectedly short");
      duration=fullSeconds(sourceText);
      setText(sourceText); setStatus("FULL BOOK · "+Math.round(duration/60)+" MIN");
    }catch(e){setStatus("FULL BOOK UNAVAILABLE"); return;}
  }
  start();
}
async function init(){
  if(!id){errorEl.style.display="flex";titleEl.textContent="";return;}
  try{
    book=await loadBook(id);
    titleEl.textContent=book.title;
    document.title="CICAN BOOKS — "+book.title;
    await setMode("15");
  }catch(e){
    console.error(e);
    document.querySelector(".reader").style.display="none";
    errorEl.style.display="flex";
  }
}
pauseBtn.addEventListener("click",pause);
mode15.addEventListener("click",()=>setMode("15"));
modeFull.addEventListener("click",()=>setMode("full"));
fullscreenBtn.addEventListener("click",async()=>{
  try{
    if(document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch(_){}
});
textEl.addEventListener("wheel",()=>{ if(!paused){paused=true;stop();pauseBtn.textContent="RESUME";setStatus("MANUAL READING");}},{passive:true});
textEl.addEventListener("touchstart",()=>{ if(!paused){paused=true;stop();pauseBtn.textContent="RESUME";setStatus("MANUAL READING");}},{passive:true});
init();
</script>
</body>
</html>
