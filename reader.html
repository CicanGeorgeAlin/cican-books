<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>CICAN BOOKS — Reader</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
.shell{min-height:100vh;display:flex;flex-direction:column}
.shell.pseudo-fullscreen{position:fixed;inset:0;width:100vw;height:100dvh;z-index:9999;background:#000}
.shell.pseudo-fullscreen .top{display:none}
.shell.pseudo-fullscreen .reader{width:min(100%,920px);padding-top:18px}
.shell.pseudo-fullscreen .eyebrow,.shell.pseudo-fullscreen h1,.shell.pseudo-fullscreen .modes,.shell.pseudo-fullscreen .status{display:none}
.shell.pseudo-fullscreen .text{padding-top:10px}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.brand{color:#fff;text-decoration:none;font-size:16px;font-weight:900;letter-spacing:-.05em}
.back{color:rgba(255,255,255,.5);text-decoration:none;font-size:9px;font-weight:800;letter-spacing:.18em}
.reader{width:min(100%,860px);margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0;padding:24px 20px 18px}
.eyebrow{color:rgba(255,255,255,.38);font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
h1{margin-top:8px;font-size:clamp(23px,5vw,36px);line-height:1.12;letter-spacing:-.035em}
.modes{display:flex;gap:7px;margin:18px auto 10px;width:min(100%,390px)}
.mode,.control{flex:1;min-height:38px;border:1px solid rgba(255,255,255,.16);border-radius:20px;background:#080808;color:rgba(255,255,255,.58);font-size:9px;font-weight:900;letter-spacing:.13em;cursor:pointer}
.mode.active{background:#fff;color:#000;border-color:#fff}
.progress{height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.fill{width:0;height:100%;background:#fff}
.status{height:28px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.34);font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.reader-hud{position:fixed;right:30%;top:clamp(64px,9vh,78px);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:clamp(82px,15.7vw,108px);padding:6px 8px;border:1px solid rgba(255,255,255,.16);border-radius:9px;background:rgba(0,0,0,.76);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.30);pointer-events:auto;touch-action:none;user-select:none}
.reader-timer{color:#fff;font-size:13px;line-height:1;font-weight:bold;font-variant-numeric:tabular-nums;white-space:nowrap}
.reader-percent{color:#fff;font-size:10px;line-height:1;font-weight:500;opacity:.82;letter-spacing:.4px;white-space:nowrap}
@media(max-width:600px){.reader-hud{right:18%;top:64px}}
.text{flex:1;min-height:0;overflow-y:auto;padding:18px 8px 120px;scroll-behavior:auto;font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;font-size:clamp(17px,2.2vw,21px);line-height:1.82;color:rgba(255,255,255,.94);white-space:pre-wrap;overflow-wrap:anywhere;-webkit-overflow-scrolling:touch}
.text::-webkit-scrollbar{width:5px}.text::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:8px}
.bottom{display:flex;gap:8px;position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(94vw,390px);z-index:5}
.control{background:rgba(0,0,0,.92);border-color:rgba(255,255,255,.22);backdrop-filter:blur(8px)}
.control.primary{background:#fff;color:#000;border-color:#fff}
.control:active,.mode:active{transform:scale(.98)}
.error{display:none;align-items:center;justify-content:center;min-height:50vh;color:rgba(255,255,255,.6);text-align:center;font-size:12px;line-height:1.7}
@media(max-width:600px){.reader{padding:18px 14px 12px}.top{height:54px;padding:0 14px}.text{padding:14px 4px 120px;font-size:17px;line-height:1.76}h1{font-size:24px}.modes{margin-top:15px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><a class="brand" href="index.html">CICAN</a><a class="back" href="index.html">BOOKS</a></header>
<main class="reader">
<div class="eyebrow" id="eyebrow">CICAN READER</div>
<h1 id="title">Loading…</h1>
<div class="modes" role="tablist" aria-label="Reading mode">
<button id="mode15" class="mode active" type="button">15 MIN</button>
<button id="modeFull" class="mode" type="button">FULL BOOK</button>
</div>
<div class="progress"><div id="fill" class="fill"></div></div>
<div id="status" class="status">LOADING</div>
<div class="reader-hud" id="readerHUD" aria-live="polite"><div class="reader-timer" id="readerTimer">15:00</div><div class="reader-percent" id="readerPercent">0%</div></div>
<article id="text" class="text" tabindex="0"></article>
<div id="error" class="error">This book could not be opened.<br><br><a href="index.html" style="color:#fff">RETURN TO BOOKS</a></div>
</main>
<div class="bottom">
<button id="pause" class="control primary" type="button">PAUSE</button>
<button id="fullscreen" class="control" type="button">FULL SCREEN</button>
</div>
</div>
<script type="module">
import { loadBook } from "./engine/book-loader.js?v=18.25";

const params = new URLSearchParams(location.search);
const id = params.get("book");
const titleEl = document.getElementById("title");
const textEl = document.getElementById("text");
const statusEl = document.getElementById("status");
const fillEl = document.getElementById("fill");
const errorEl = document.getElementById("error");
const mode15 = document.getElementById("mode15");
const modeFull = document.getElementById("modeFull");
const pauseBtn = document.getElementById("pause");
const fullscreenBtn = document.getElementById("fullscreen");

let book = null;
let mode = "15";
let paused = false;
let started = false;
let startTime = 0;
let elapsedBeforePause = 0;
let duration = 900;
let animationFrame = 0;
let sourceText = "";
let currentText = "";
let autoReaderReady = false;
let readerScrollPosition = 0;
let readerLastTime = 0;
let lastReaderSaveTime = 0;
let readerComplete = false;
let readerManualResumeTimer = null;
const READER_STATE_PREFIX = "cican_reader_position:";
const READER_MANUAL_RESUME_MS = 350;

const FULL_READING_WPM = 100;
const MIN_READER_SECONDS = 60;
const LAYOUT_SETTLE_MS = 80;
const RAF_WARMUP_FRAMES = 2;

function wordCount(text){ return (String(text||"").trim().match(/\S+/g)||[]).length; }
function fullSeconds(text){ return Math.max(900, Math.ceil(wordCount(text)/FULL_READING_WPM*60)); }
function formatTime(seconds){const s=Math.max(0,Math.floor(seconds));return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor((s%3600)/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function formatReaderTime(seconds){if(mode==="15"){const s=Math.max(0,Math.floor(seconds));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}return formatTime(seconds);}
function positionKey(){return book?.id ? READER_STATE_PREFIX+book.id+":"+mode : null;}
function loadSavedPosition(){const k=positionKey();if(!k)return 0;try{const v=Number(localStorage.getItem(k));return Number.isFinite(v)&&v>=0?v:0}catch(_){return 0}}
function savePosition(){const k=positionKey();if(!k)return;try{localStorage.setItem(k,String(Math.max(0,readerScrollPosition)));lastReaderSaveTime=performance.now()}catch(_){}}
function clearPosition(){const k=positionKey();if(!k)return;try{localStorage.removeItem(k)}catch(_){}}
function updateReaderUI(){const max=maxScroll();const p=max>0?Math.min(1,textEl.scrollTop/max):0;fillEl.style.width=(p*100).toFixed(2)+"%";document.getElementById("readerPercent").textContent=Math.floor(p*100)+"%";document.getElementById("readerTimer").textContent=formatReaderTime(Math.max(0,duration*(1-p)));}

function setStatus(s){ statusEl.textContent=s; }
function setText(text){
  currentText=String(text||"").trim();
  textEl.textContent=currentText;
  textEl.scrollTop=0;
  fillEl.style.width="0%";
  autoReaderReady=false;
}
function stop(){
  cancelAnimationFrame(animationFrame);
  animationFrame=0;
}
function elapsed(){
  return elapsedBeforePause + (paused ? 0 : (performance.now()-startTime)/1000);
}
function maxScroll(){ return Math.max(0,textEl.scrollHeight-textEl.clientHeight); }
function tick(now){
  if(!started || readerComplete) return;
  const delta=Math.min(0.05,Math.max(0,(now-readerLastTime)/1000));
  readerLastTime=now;
  if(paused){animationFrame=requestAnimationFrame(tick);return;}
  const max=maxScroll();
  if(max<=0){animationFrame=requestAnimationFrame(tick);return;}
  const pxPerSecond=max/duration;
  readerScrollPosition=Math.min(max,readerScrollPosition+pxPerSecond*delta);
  textEl.scrollTop=readerScrollPosition;
  const p=readerScrollPosition/max;
  updateReaderUI();
  if(performance.now()-lastReaderSaveTime>2000) savePosition();
  if(readerScrollPosition>=max-1){finishReader();return;}
  animationFrame=requestAnimationFrame(tick);
}
function finishReader(){
  readerComplete=true;stop();readerScrollPosition=maxScroll();textEl.scrollTop=readerScrollPosition;
  updateReaderUI();document.getElementById("readerTimer").textContent=formatReaderTime(0);document.getElementById("readerPercent").textContent="100%";
  setStatus("COMPLETE");pauseBtn.textContent="REPLAY";savePosition();
}

function start(reset=true){
  stop();
  if(!currentText){setStatus("NO TEXT");return;}
  if(reset){elapsedBeforePause=0;readerComplete=false;readerScrollPosition=0;textEl.scrollTop=0;}
  paused=false; started=true; autoReaderReady=false; readerComplete=false; readerScrollPosition=reset?0:Math.min(maxScroll(),textEl.scrollTop||readerScrollPosition||loadSavedPosition()); textEl.scrollTop=readerScrollPosition; updateReaderUI(); readerLastTime=performance.now(); startTime=performance.now();
  pauseBtn.textContent="PAUSE";
  setStatus(mode==="15"?"AUTO-READING · 15 MIN":"AUTO-READING · FULL BOOK");
  const warmup=()=>{
    if(!started || paused) return;
    let frames=0;
    const ready=()=>{
      if(!started || paused) return;
      frames++;
      if(frames < RAF_WARMUP_FRAMES){ requestAnimationFrame(ready); return; }
      const max=maxScroll();
      if(max <= 0){
        setStatus("READER LAYOUT ERROR");
        return;
      }
      autoReaderReady=true;
      animationFrame=requestAnimationFrame(tick);
    };
    requestAnimationFrame(ready);
  };
  setTimeout(warmup,LAYOUT_SETTLE_MS);
}
function pause(){
  if(!started){start();return;}
  if(!paused){
    elapsedBeforePause=Math.min(duration,elapsed());
    paused=true; stop(); pauseBtn.textContent="RESUME"; setStatus("PAUSED");
  }else{
    if(elapsedBeforePause>=duration || readerComplete){elapsedBeforePause=0;readerComplete=false;readerScrollPosition=0;clearPosition();textEl.scrollTop=0;fillEl.style.width="0%";}
    paused=false; started=true; autoReaderReady=false; startTime=performance.now();
    pauseBtn.textContent="PAUSE";
    setStatus(mode==="15"?"AUTO-READING · 15 MIN":"AUTO-READING · FULL BOOK");
    const warmup=()=>{
      if(!started || paused) return;
      let frames=0;
      const ready=()=>{
        if(!started || paused) return;
        frames++;
        if(frames < RAF_WARMUP_FRAMES){ requestAnimationFrame(ready); return; }
        autoReaderReady=true;
        animationFrame=requestAnimationFrame(tick);
      };
      requestAnimationFrame(ready);
    };
    setTimeout(warmup,LAYOUT_SETTLE_MS);
  }
}
async function setMode(next){
  if(!book) return;
  mode=next;
  mode15.classList.toggle("active",mode==="15");
  modeFull.classList.toggle("active",mode==="full");
  stop(); paused=false; started=false; elapsedBeforePause=0; autoReaderReady=false; textEl.scrollTop=0;
  if(mode==="15"){
    sourceText=book.fifteenMinuteText||"";
    duration=Math.max(MIN_READER_SECONDS,Number(book.targetMinutes||15)*60);
    setText(sourceText); setStatus("15 MINUTES");
  }else{
    setStatus("LOADING FULL BOOK");
    try{
      if(book.fullText && String(book.fullText).trim()) sourceText=book.fullText;
      else if(book.fullTextUrl){
        const res=await fetch(new URL(book.fullTextUrl,document.baseURI).href,{cache:"no-store"});
        if(!res.ok) throw new Error("Full book source unavailable");
        sourceText=await res.text();
      }else throw new Error("No full book source");
      if(wordCount(sourceText)<500) throw new Error("Full book source is unexpectedly short");
      duration=fullSeconds(sourceText);
      setText(sourceText); setStatus("FULL BOOK · "+Math.round(duration/60)+" MIN");
    }catch(e){setStatus("FULL BOOK UNAVAILABLE"); return;}
  }
  start();
}
async function init(){
  if(!id){errorEl.style.display="flex";titleEl.textContent="";return;}
  try{
    book=await loadBook(id);
    titleEl.textContent=book.title;
    document.title="CICAN BOOKS — "+book.title;
    await setMode("15");
  }catch(e){
    console.error(e);
    document.querySelector(".reader").style.display="none";
    errorEl.style.display="flex";
  }
}
pauseBtn.addEventListener("click",pause);
mode15.addEventListener("click",()=>setMode("15"));
modeFull.addEventListener("click",()=>setMode("full"));
const shell=document.querySelector(".shell");
function syncFullscreenButton(){
  const active=!!document.fullscreenElement || shell.classList.contains("pseudo-fullscreen");
  fullscreenBtn.textContent=active?"EXIT FULL SCREEN":"FULL SCREEN";
}
document.addEventListener("fullscreenchange",syncFullscreenButton);
fullscreenBtn.addEventListener("click",async()=>{
  try{
    if(document.fullscreenElement){
      await document.exitFullscreen();
      return;
    }
    if(document.fullscreenEnabled){
      const target=shell;
      if(target.requestFullscreen) await target.requestFullscreen();
      else if(target.webkitRequestFullscreen) target.webkitRequestFullscreen();
      else throw new Error("Fullscreen API unavailable");
      return;
    }
  }catch(_){}
  shell.classList.toggle("pseudo-fullscreen");
  syncFullscreenButton();
});
let pointerDown=false,pointerMoved=false;
textEl.addEventListener("pointerdown",e=>{pointerDown=true;pointerMoved=false;textEl.dataset.px=e.clientX;textEl.dataset.py=e.clientY;});
textEl.addEventListener("pointermove",e=>{if(!pointerDown)return;if(Math.abs(e.clientX-Number(textEl.dataset.px))>6||Math.abs(e.clientY-Number(textEl.dataset.py))>6){pointerMoved=true;if(!paused){paused=true;stop();pauseBtn.textContent="RESUME";setStatus("MANUAL READING");}}});
textEl.addEventListener("pointerup",()=>{pointerDown=false;if(pointerMoved&&!readerComplete){clearTimeout(readerManualResumeTimer);readerManualResumeTimer=setTimeout(()=>{if(!readerComplete&&!paused){start(false)}},READER_MANUAL_RESUME_MS);}});
textEl.addEventListener("wheel",()=>{if(!paused&&!readerComplete){paused=true;stop();pauseBtn.textContent="RESUME";setStatus("MANUAL READING");clearTimeout(readerManualResumeTimer);readerManualResumeTimer=setTimeout(()=>{if(!readerComplete){paused=false;pauseBtn.textContent="PAUSE";start(false)}},READER_MANUAL_RESUME_MS);}}, {passive:true});
init();
</script>
</body>
</html>
