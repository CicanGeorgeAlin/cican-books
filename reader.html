<script type="module">
const BOOK_ID = new URLSearchParams(location.search).get("book");
let BOOK_READ = null;
let currentBook = null;
let readerAnimation = null;
let readerStartTimer = null;
let readerPaused = false;
let readerComplete = false;
let readerSeconds = 900;
let readerLastTime = 0;
let readerScrollPosition = 0;
let readingMode = "15";
let fullTextLoading = false;
let readerOpenToken = 0;
let readerProgrammaticScroll = false;
let readerManualResumeTimer = null;
let lastReaderSaveTime = 0;
const READER_FIRST_TEXT_HOLD_MS = 0;
const READER_MANUAL_RESUME_MS = 350;
const TARGET_READING_SECONDS = 900;
const READER_WPM = 100;
const FIFTEEN_MINUTE_TARGET_WORDS = READER_WPM * TARGET_READING_SECONDS / 60;
const FULL_READING_WPM = READER_WPM;
let fullReaderSeconds = TARGET_READING_SECONDS;
function calculateFullReadingSeconds(text) {
  const words = String(text || "").trim().match(/\S+/g);
  const count = words ? words.length : 0;
  return Math.max(TARGET_READING_SECONDS, Math.ceil(count / FULL_READING_WPM * 60));
}
const READER_STATE_PREFIX = "cican_reader_position:";
const READER_MODE_PREFIX = "cican_reader_mode:";
async function loadSelectedBook() {
  const mod = await import("./engine/book-loader.js?v=18.30");
  currentBook = await mod.loadBook(BOOK_ID);
  window.CICAN_ACTIVE_BOOK_ID = BOOK_ID;
  window.CICAN_ACTIVE_BOOK = currentBook;
}
/* =================================================
   READER ELEMENTS
================================================= */

const reader =
    document.getElementById(
        "reader"
    );

const readerText =
    document.getElementById(
        "readerText"
    );

const readerPause =
    document.getElementById(
        "readerPause"
    );

const readerClose =
    document.getElementById(
        "readerClose"
    );

const readerStatus =
    document.getElementById(
        "readerStatus"
    );

const mode15 = document.getElementById("mode15");
const modeFull = document.getElementById("modeFull");
const readerModeNote = document.getElementById("readerModeNote");
const readerProgressFill = document.getElementById("readerProgressFill");


/* =================================================
   FORMAT TIME
================================================= */

function formatTime(
    seconds
) {

    const s =
        Math.max(
            0,
            Math.floor(seconds)
        );

    const hours = Math.floor(s / 3600);
    const minutes = Math.floor((s % 3600) / 60);
    const remainingSeconds = s % 60;

    return String(hours).padStart(2, "0")
        + ":"
        + String(minutes).padStart(2, "0")
        + ":"
        + String(remainingSeconds).padStart(2, "0");
}

function formatReaderTime(seconds) {
    const s = Math.max(0, Math.floor(seconds));

    if (readingMode === "15") {
        const minutes = Math.floor(s / 60);
        const remainingSeconds = s % 60;

        return String(minutes).padStart(2, "0")
            + ":"
            + String(remainingSeconds).padStart(2, "0");
    }

    return formatTime(s);
}


/* =================================================
   READER UI
================================================= */

function updateReaderModeUI() {
    /*
        FULL BOOK availability is strict:
        only a complete source asset or complete source URL
        may enable FULL BOOK.
    */
    const fullAvailable = !!(
        currentBook &&
        (
            currentBook.fullText ||
            currentBook.fullTextUrl
        )
    );

    const fifteenAvailable = !!(
        currentBook &&
        (
            currentBook.fifteenMinuteText ||
            currentBook.fullText
        )
    );

    mode15.classList.toggle("active", readingMode === "15");
    modeFull.classList.toggle("active", readingMode === "full");

    modeFull.disabled =
        fullTextLoading ||
        !fullAvailable;

    mode15.disabled =
        fullTextLoading ||
        !fifteenAvailable;

    readerModeNote.textContent =
        readingMode === "full"
            ? (
                fullAvailable
                    ? "FULL SOURCE TEXT"
                    : "FULL BOOK NOT YET LOADED FOR THIS EDITION"
            )
            : (
                fifteenAvailable
                    ? "15-MINUTE SOURCE TEXT"
                    : "15-MINUTE SOURCE TEXT NOT YET AVAILABLE FOR THIS EDITION"
            );
}

function saveReaderMode() {
    if (!window.CICAN_ACTIVE_BOOK_ID) return;
    try { localStorage.setItem(READER_MODE_PREFIX + window.CICAN_ACTIVE_BOOK_ID, readingMode); } catch (_) {}
}

function updateReaderUI() {

    const maxScroll =
        Math.max(
            0,
            readerText.scrollHeight -
            readerText.clientHeight
        );


    const progress =
        maxScroll > 0
        ? Math.min(
            1,
            readerText.scrollTop /
            maxScroll
        )
        : 0;


    const percent =
        Math.floor(
            progress * 100
        );


    document.getElementById(
        "readerTimer"
    ).textContent =
        formatReaderTime(readerSeconds);


    document.getElementById(
        "readerPercent"
    ).textContent =
        percent + "%";

    if (readerProgressFill) {
        readerProgressFill.style.width =
            (progress * 100).toFixed(2) + "%";
    }


    /*
       The movable reader HUD remains the primary
       information display. The rail is a quiet
       visual orientation aid only.
    */
}


/* =================================================
   STOP READER
================================================= */

function stopReaderAnimation() {

    if (readerStartTimer !== null) {
        clearTimeout(readerStartTimer);
        readerStartTimer = null;
    }

    if (
        readerAnimation !== null
    ) {

        cancelAnimationFrame(
            readerAnimation
        );

        readerAnimation =
            null;
    }
}

function startReaderAnimation(delayMs = 0, openToken = readerOpenToken) {

    if (readerStartTimer !== null) {
        clearTimeout(readerStartTimer);
        readerStartTimer = null;
    }

    const start = function() {
        readerStartTimer = null;

        if (
            openToken !== readerOpenToken ||
            !reader.classList.contains("open") ||
            readerComplete ||
            readerPaused
        ) {
            return;
        }

        const maxScroll = Math.max(
            0,
            readerText.scrollHeight - readerText.clientHeight
        );

        if (maxScroll <= 0) {
            finishReader();
            return;
        }

        readerStatus.textContent = "AUTO-READING";
        readerLastTime = performance.now();
        readerAnimation = requestAnimationFrame(fluidAutoReader);
    };

    if (delayMs > 0) {
        readerStartTimer = setTimeout(start, delayMs);
    } else {
        start();
    }
}


/* =================================================
   OPEN READER
================================================= */

function normalizeSourceText(sourceText) {

    let normalizedText =
        String(sourceText || "")
            .replace(/\r\n/g, "\n");

    const startMarker =
        normalizedText.indexOf(
            "*** START OF THE PROJECT GUTENBERG EBOOK"
        );

    const endMarker =
        normalizedText.indexOf(
            "*** END OF THE PROJECT GUTENBERG EBOOK"
        );

    if (
        startMarker >= 0 &&
        endMarker > startMarker
    ) {
        normalizedText =
            normalizedText
                .slice(
                    normalizedText.indexOf("\n", startMarker) + 1,
                    endMarker
                )
                .trim();
    }

    return normalizedText.trim();
}


function selectFifteenMinuteText(
    sourceText,
    targetWords,
    startMarker = ""
) {

    let normalizedText =
        normalizeSourceText(sourceText);

    if (!normalizedText) {
        return "";
    }

    const marker =
        String(startMarker || "").trim();

    if (marker) {
        const markerIndex =
            normalizedText.indexOf(marker);

        if (markerIndex >= 0) {
            normalizedText =
                normalizedText
                    .slice(markerIndex)
                    .trim();
        }
    }

    const words =
        [...normalizedText.matchAll(/\S+/g)];

    const limit =
        Math.max(
            1,
            Number(targetWords) || 2700
        );

    if (
        words.length <= limit
    ) {
        return normalizedText;
    }

    const lastWord =
        words[limit - 1];

    return normalizedText
        .slice(
            0,
            lastWord.index +
            lastWord[0].length
        )
        .trim();
}


async function loadSourceTextForReader(
    book,
    openToken
) {

    if (
        book.fullText &&
        String(book.fullText).trim()
    ) {
        return normalizeSourceText(
            book.fullText
        );
    }

    /*
        SOURCE CONTRACT:
        book.fifteenMinuteText is the calibrated 15-minute source selection.
        book.text is legacy-compatible source selection only when present.
        Neither is eligible as a FULL BOOK source.
    */

    if (
        !book.fullTextUrl
    ) {
        return "";
    }

    const sourceUrl =
        new URL(
            book.fullTextUrl,
            document.baseURI
        ).href;

    const response =
        await fetch(
            sourceUrl,
            {
                cache: "no-store"
            }
        );

    if (
        !response.ok
    ) {
        throw new Error(
            "Full text request failed"
        );
    }

    const sourceText =
        await response.text();

    if (
        sourceText.trim().length < 1000
    ) {
        throw new Error(
            "Full text is unexpectedly short"
        );
    }

    if (
        openToken !== readerOpenToken
    ) {
        return "";
    }

    const normalizedText =
        normalizeSourceText(
            sourceText
        );

    book.fullText =
        normalizedText;

    return normalizedText;
}


function renderReaderText(sourceText) {
    const raw = String(sourceText || "")
        .replace(/\r\n/g, "\n")
        .trim();

    readerText.replaceChildren();

    if (!raw) return;

    const blocks = raw.split(/\n[ \t]*\n+/);
    const fragment = document.createDocumentFragment();

    for (const block of blocks) {
        const text = block
            .replace(/\n+/g, " ")
            .replace(/[ \t]+/g, " ")
            .trim();

        if (!text) continue;

        const el = document.createElement("div");
        el.className = "reader-block";

        if (
            /^(chapter|part|book|preface|introduction|contents|epilogue|prologue|section)\b/i.test(text) ||
            (text.length < 90 && !/[.!?]$/.test(text))
        ) {
            el.classList.add("reader-heading");
        }

        el.textContent = text;
        fragment.appendChild(el);
    }

    readerText.appendChild(fragment);
}

async function openReader(modeOverride) {

    stopReaderAnimation();

    const openToken = ++readerOpenToken;

    // A newly opened reader always begins at the first character.
    readerScrollPosition = 0;
    readerComplete = false;
    readerPaused = false;

    if (modeOverride === "15" || modeOverride === "full") {
        readingMode = modeOverride;
    }


    currentBook =
        window.CICAN_ACTIVE_BOOK ||
        BOOK_READ;

    if (!currentBook) {
        return;
    }


    readerPaused =
        false;


    readerComplete =
        false;


    /*
        Resolve the requested mode before calculating
        the reader duration. The mode must exist before
        any FULL BOOK timing logic runs.
    */
    const requestedMode = readingMode;
    const requestedBook = currentBook;
    const isFullBook = requestedMode === "full";

    readerSeconds =
        isFullBook && currentBook.fullText
            ? calculateFullReadingSeconds(currentBook.fullText)
            : TARGET_READING_SECONDS;

    fullReaderSeconds = readerSeconds;


    /*
        RENDER THE ENTIRE BOOK.

        No word-by-word progression.
        No chunks.
        No typing effect.
    */

    /*
        15 MIN is source text only.
        Never fall back to a CICAN-written summary.

        IMPORTANT:
        fullTextUrl is a LOCATION, not the source text itself.
        Never display the path as reader content.
    */
    if (!isFullBook) {
        const fifteenValue = String(
            currentBook.fifteenMinuteText || ""
        ).trim();
        const fullPath = String(
            currentBook.fullTextUrl || ""
        ).trim();

        /*
            Guard against stale/cached book modules that may have
            populated fifteenMinuteText with the asset path itself.
            That value is metadata, never reader text.
        */
        if (
            fifteenValue &&
            fullPath &&
            fifteenValue === fullPath
        ) {
            currentBook.fifteenMinuteText = "";
        }
    }

    if (!isFullBook) {
        /*
            Recalibrate the 15-minute source to the current reader
            speed. This keeps the 15-minute experience aligned with
            the slower 135 WPM target instead of inheriting an older
            150 WPM / 2700-word calibration.
        */
        const fifteenSource =
            currentBook.fullText ||
            currentBook.fifteenMinuteText ||
            "";

        if (String(fifteenSource).trim()) {
            currentBook.fifteenMinuteText =
                selectFifteenMinuteText(
                    fifteenSource,
                    FIFTEEN_MINUTE_TARGET_WORDS,
                    currentBook.fifteenMinuteStartMarker
                );
        }
    }

    if (
        !isFullBook &&
        !currentBook.fifteenMinuteText
    ) {

        fullTextLoading = true;
        readerModeNote.textContent =
            "LOADING SOURCE TEXT";

        try {

            const sourceText =
                await loadSourceTextForReader(
                    currentBook,
                    openToken
                );

            if (
                openToken !== readerOpenToken ||
                readingMode !== requestedMode ||
                currentBook !== requestedBook
            ) {
                fullTextLoading = false;
                return;
            }

            if (
                sourceText
            ) {
                currentBook.fifteenMinuteText =
                    selectFifteenMinuteText(
                        sourceText,
                        FIFTEEN_MINUTE_TARGET_WORDS,
                        currentBook.fifteenMinuteStartMarker
                    );
            }

            if (
                !currentBook.fifteenMinuteText
            ) {
                throw new Error(
                    "15-minute source text unavailable"
                );
            }

        } catch (_) {

            if (
                openToken !== readerOpenToken ||
                readingMode !== requestedMode ||
                currentBook !== requestedBook
            ) {
                fullTextLoading = false;
                return;
            }

            fullTextLoading = false;
            readerModeNote.textContent =
                "15-MINUTE SOURCE TEXT NOT YET AVAILABLE FOR THIS EDITION";
            updateReaderModeUI();
            return;
        }

        fullTextLoading = false;
    }


    if (
        isFullBook &&
        !currentBook.fullText
    ) {
        /*
            Prefer a dedicated full-text asset when one exists.
            Otherwise use the book's canonical text already loaded
            in the book record.
        */
        if (!currentBook.fullTextUrl) {
            readerModeNote.textContent = "FULL BOOK SOURCE NOT AVAILABLE FOR THIS EDITION";
            updateReaderModeUI();
            return;
        } else {
            fullTextLoading = true;
            modeFull.disabled = true;
            readerModeNote.textContent = "LOADING FULL BOOK";
            try {
                const response = await fetch(currentBook.fullTextUrl, { cache: "no-store" });
                if (!response.ok) throw new Error("Full text request failed");
                const sourceText = await response.text();
                if (sourceText.trim().length < 1000) throw new Error("Full text is unexpectedly short");

                let normalizedText = sourceText.replace(/\\r\\n/g, "\\n");

                /*
                    Project Gutenberg full-text files contain a license
                    wrapper around the actual book. For FULL BOOK, keep
                    the complete book itself while excluding that wrapper.
                */
                const startMarker = normalizedText.indexOf("*** START OF THE PROJECT GUTENBERG EBOOK");
                const endMarker = normalizedText.indexOf("*** END OF THE PROJECT GUTENBERG EBOOK");

                if (startMarker >= 0 && endMarker > startMarker) {
                    normalizedText = normalizedText
                        .slice(normalizedText.indexOf("\\n", startMarker) + 1, endMarker)
                        .trim();
                }

                if (
                    openToken !== readerOpenToken ||
                    readingMode !== requestedMode ||
                    currentBook !== requestedBook
                ) {
                    requestedBook.fullText = normalizedText;
                    fullTextLoading = false;
                    return;
                }

                currentBook.fullText = normalizedText;
                currentBook.fullTextResolved = true;
            } catch (_) {
                if (
                    openToken !== readerOpenToken ||
                    readingMode !== requestedMode ||
                    currentBook !== requestedBook
                ) {
                    fullTextLoading = false;
                    return;
                }

                fullTextLoading = false;
                updateReaderModeUI();
                readerModeNote.textContent = "FULL BOOK COULD NOT BE LOADED";
                return;
            }
            fullTextLoading = false;
        }
    }

    const fullAvailable = !!(
        currentBook &&
        (
            currentBook.fullText ||
            currentBook.fullTextUrl
        )
    );

    const fifteenAvailable = !!(
        currentBook &&
        currentBook.fifteenMinuteText
    );

    if (
        !isFullBook &&
        !fifteenAvailable
    ) {
        readerModeNote.textContent =
            "15-MINUTE SOURCE TEXT NOT YET AVAILABLE FOR THIS EDITION";
        return;
    }

    /*
        FULL BOOK timing is finalized only after the complete
        source has actually been resolved. This prevents a
        URL-backed book from inheriting the 15-minute duration.
    */
    if (
        isFullBook &&
        currentBook.fullText
    ) {
        fullReaderSeconds =
            calculateFullReadingSeconds(
                currentBook.fullText
            );

        readerSeconds =
            fullReaderSeconds;
    }

    if (
        isFullBook &&
        !fullAvailable
    ) {
        readerModeNote.textContent =
            "FULL BOOK NOT YET LOADED FOR THIS EDITION";
        return;
    }

    const activeReaderSource =
        isFullBook
            ? currentBook.fullText
            : currentBook.fifteenMinuteText;

    if (!String(activeReaderSource || "").trim()) {
        readerModeNote.textContent =
            isFullBook
                ? "FULL BOOK NOT YET AVAILABLE FOR THIS EDITION"
                : "15-MINUTE SOURCE TEXT NOT YET AVAILABLE FOR THIS EDITION";
        return;
    }

    renderReaderText(activeReaderSource);

    // Do not restore an old reading position: every opening starts at 0.
    readerScrollPosition = 0;

    const savedProgress = 0;

    readerModeNote.textContent =
        isFullBook
            ? "FULL SOURCE TEXT"
            : (
                savedProgress > 0.01
                    ? "CONTINUING FROM " +
                      Math.floor(savedProgress * 100) +
                      "%"
                    : "15-MINUTE SOURCE TEXT"
            );

    mode15.classList.toggle("active", readingMode === "15");
    modeFull.classList.toggle("active", readingMode === "full");
    modeFull.disabled = !fullAvailable;
    document.getElementById("readerTimer").textContent =
        formatReaderTime(readerSeconds);

    readerPause.style.display = "";
    readerPause.textContent = "PAUSE";


    readerStatus.textContent = "AUTO-READING";


    reader.classList.add(
        "open"
    );

    restoreHUDPosition();
    restoreFullscreenButtonPosition();


    /*
        Allow the browser to calculate
        the complete text height before
        starting the fluid movement.
    */

    requestAnimationFrame(
        function() {

            const availableScroll =
                Math.max(
                    0,
                    readerText.scrollHeight -
                    readerText.clientHeight
                );

            readerScrollPosition =
                Math.min(
                    Math.max(0, readerScrollPosition),
                    availableScroll
                );

            readerProgrammaticScroll = true;
            readerText.scrollTop =
                readerScrollPosition;
            readerProgrammaticScroll = false;

            updateReaderUI();

            /*
                Give the reader a short, stable view of the
                first text before automatic movement begins.
                Returning readers resume immediately.
            */
            // Force the beginning again after layout has settled.
            readerProgrammaticScroll = true;
            readerScrollPosition = 0;
            readerText.scrollTop = 0;
            readerProgrammaticScroll = false;
            updateReaderUI();

            // Hold the first text briefly, then start one controlled
            // auto-reader loop.
            startReaderAnimation(
                READER_FIRST_TEXT_HOLD_MS,
                openToken
            );
        }
    );
}


/* =================================================
   FLUID AUTO READER
================================================= */

function fluidAutoReader(now) {

    if (
        readerComplete
    ) {

        return;
    }


    /*
        Calculate real frame time.
    */

    const delta =
        Math.min(
            0.05,
            (
                now -
                readerLastTime
            ) / 1000
        );


    readerLastTime =
        now;


    /*
        PAUSED
    */

    if (
        readerPaused
    ) {

        readerAnimation =
            requestAnimationFrame(
                fluidAutoReader
            );

        return;
    }


    const maxScroll =
        Math.max(
            0,
            readerText.scrollHeight -
            readerText.clientHeight
        );


    /*
        Nothing to scroll.
    */

    if (
        maxScroll <= 0
    ) {

        finishReader();

        return;
    }


    /*
        CONSTANT FLUID SPEED.

        Complete scroll distance is divided
        across this mode's actual reading duration:
        the configured 15-minute target for 15 MIN,
        or the full-source duration for FULL BOOK.
    */

    const activeReadingSeconds =
        readingMode === "full"
            ? fullReaderSeconds
            : TARGET_READING_SECONDS;

    const pixelsPerSecond =
        maxScroll /
        activeReadingSeconds;


    readerScrollPosition +=
        pixelsPerSecond *
        delta;

    if (
        now - lastReaderSaveTime >
        2000
    ) {
        saveReaderPosition(now);
    }


    readerScrollPosition =
        Math.min(
            maxScroll,
            readerScrollPosition
        );


    readerProgrammaticScroll = true;
    readerText.scrollTop =
        readerScrollPosition;
    readerProgrammaticScroll = false;


    /*
        Calculate progress directly
        from physical reading position.
    */

    const progress =
        readerScrollPosition /
        maxScroll;


    readerSeconds =
        Math.max(
            0,
            activeReadingSeconds *
            (1 - progress)
        );


    updateReaderUI();


    /*
        END
    */

    if (
        readerScrollPosition >=
        maxScroll - 1
    ) {

        finishReader();

        return;
    }


    /*
        CONTINUE EVERY FRAME
    */

    readerAnimation =
        requestAnimationFrame(
            fluidAutoReader
        );
}


/* =================================================
   FINISH READER
================================================= */

function readerPositionKey() {
    if (!window.CICAN_ACTIVE_BOOK_ID) return null;
    return READER_STATE_PREFIX + window.CICAN_ACTIVE_BOOK_ID + ":" + readingMode;
}

function loadReaderPosition() {
    const key = readerPositionKey();
    if (!key) return 0;
    try {
        const value = Number(localStorage.getItem(key));
        return Number.isFinite(value) && value >= 0 ? value : 0;
    } catch (_) {
        return 0;
    }
}

function saveReaderPosition(now) {

    if (
        !currentBook ||
        !window.CICAN_ACTIVE_BOOK_ID
    ) {
        return;
    }

    try {
        localStorage.setItem(
            READER_STATE_PREFIX +
            window.CICAN_ACTIVE_BOOK_ID +
            ":" +
            readingMode,
            String(
                Math.max(
                    0,
                    readerScrollPosition
                )
            )
        );
        lastReaderSaveTime =
            now || performance.now();
    } catch (_) {}
}


function clearReaderPosition() {

    if (!window.CICAN_ACTIVE_BOOK_ID) {
        return;
    }

    try {
        localStorage.removeItem(
            READER_STATE_PREFIX +
            window.CICAN_ACTIVE_BOOK_ID +
            ":" +
            readingMode
        );
    } catch (_) {}
}


function finishReader() {

    if (
        readerComplete
    ) {

        return;
    }


    readerComplete =
        true;


    stopReaderAnimation();


    /*
        Put reader exactly at the end.
    */

    readerText.scrollTop =
        readerText.scrollHeight;


    readerScrollPosition =
        Math.max(
            0,
            readerText.scrollHeight -
            readerText.clientHeight
        );


    // Persist the exact completed position so a lifecycle interruption
    // cannot restore the reader to an earlier point.
    saveReaderPosition(performance.now());


    readerSeconds =
        0;


    document.getElementById(
        "readerTimer"
    ).textContent =
        formatReaderTime(0);


    document.getElementById(
        "readerPercent"
    ).textContent =
        "100%";


    readerStatus.textContent =
        "COMPLETE";


    readerPause.textContent =
        "READ AGAIN";
}


/* =================================================
   PAUSE / RESUME
================================================= */

mode15.addEventListener("pointerdown", function(e) {
    e.preventDefault();
    if (!currentBook) return;

    readingMode = "15";
    saveReaderMode();
    openReader("15");
});

modeFull.addEventListener("pointerdown", async function(e) {
    e.preventDefault();
    if (!currentBook || fullTextLoading) return;

    readingMode = "full";
    saveReaderMode();
    await openReader("full");
});

/*
    READER TOUCH CONTROL

    A simple tap must NOT interrupt automatic reading.
    Only an actual drag takes control of the text.
    One state owns the transition:

        AUTO -> MANUAL -> AUTO

    This prevents a tap/pointer event from racing with
    the automatic reader or creating a second animation loop.
*/
let readerPointerDownX = 0;
let readerPointerDownY = 0;
let readerPointerMoved = false;
let readerManualInteraction = false;

function clearReaderManualResumeTimer() {
    if (readerManualResumeTimer !== null) {
        clearTimeout(readerManualResumeTimer);
        readerManualResumeTimer = null;
    }
}

function scheduleReaderAutoResume() {
    clearReaderManualResumeTimer();

    readerManualResumeTimer = setTimeout(function() {
        readerManualResumeTimer = null;

        if (
            !reader.classList.contains("open") ||
            readerComplete ||
            readerPaused ||
            !readerManualInteraction
        ) {
            return;
        }

        readerManualInteraction = false;
        startReaderAnimation(0, readerOpenToken);
    }, READER_MANUAL_RESUME_MS);
}

readerText.addEventListener(
    "pointerdown",
    function(e) {
        if (e.pointerType === "mouse" && e.button !== 0) return;

        readerPointerDownX = e.clientX;
        readerPointerDownY = e.clientY;
        readerPointerMoved = false;

        clearReaderManualResumeTimer();
    },
    { passive: true }
);

readerText.addEventListener(
    "pointermove",
    function(e) {
        if (
            readerPointerMoved ||
            !reader.classList.contains("open") ||
            readerComplete ||
            readerPaused
        ) {
            return;
        }

        const dx = e.clientX - readerPointerDownX;
        const dy = e.clientY - readerPointerDownY;

        if (Math.hypot(dx, dy) < 6) {
            return;
        }

        readerPointerMoved = true;
        readerManualInteraction = true;

        stopReaderAnimation();
        readerStatus.textContent = "MANUAL SCROLL";
    },
    { passive: true }
);

readerText.addEventListener(
    "pointerup",
    function() {
        if (!readerManualInteraction) {
            readerPointerMoved = false;
            return;
        }

        readerPointerMoved = false;

        if (
            !reader.classList.contains("open") ||
            readerComplete ||
            readerPaused
        ) {
            readerManualInteraction = false;
            return;
        }

        scheduleReaderAutoResume();
    },
    { passive: true }
);

readerText.addEventListener(
    "pointercancel",
    function() {
        readerPointerMoved = false;

        if (
            !readerManualInteraction ||
            !reader.classList.contains("open") ||
            readerComplete ||
            readerPaused
        ) {
            readerManualInteraction = false;
            return;
        }

        scheduleReaderAutoResume();
    },
    { passive: true }
);


/* =================================================
   TEXT-ONLY FULLSCREEN DOUBLE-TAP EXIT
================================================= */

let readerFullscreenLastTapTime = 0;
let readerFullscreenLastTapX = 0;
let readerFullscreenLastTapY = 0;

async function exitTextOnlyFullscreen() {

    reader.classList.remove(
        "text-only-fullscreen"
    );

    try {

        if (
            document.fullscreenElement === reader &&
            document.exitFullscreen
        ) {
            await document.exitFullscreen();

        } else if (
            document.webkitFullscreenElement === reader &&
            document.webkitExitFullscreen
        ) {
            document.webkitExitFullscreen();
        }

    } catch (error) {

        console.warn(
            "CICAN could not exit full screen:",
            error
        );
    }

    updateReaderFullscreenUI();
}

readerText.addEventListener(
    "pointerup",
    function(e) {

        if (
            !reader.classList.contains(
                "text-only-fullscreen"
            ) &&
            !isReaderFullscreen()
        ) {
            return;
        }

        if (
            e.pointerType === "mouse" &&
            e.button !== 0
        ) {
            return;
        }

        const now = performance.now();

        const distanceX =
            e.clientX -
            readerFullscreenLastTapX;

        const distanceY =
            e.clientY -
            readerFullscreenLastTapY;

        const distanceSquared =
            distanceX * distanceX +
            distanceY * distanceY;

        const isDoubleTap =
            now -
                readerFullscreenLastTapTime <=
                350 &&
            distanceSquared <=
                24 * 24;

        if (isDoubleTap) {

            e.preventDefault();

            readerFullscreenLastTapTime = 0;

            exitTextOnlyFullscreen();

            return;
        }

        readerFullscreenLastTapTime = now;
        readerFullscreenLastTapX = e.clientX;
        readerFullscreenLastTapY = e.clientY;

    },
    { passive: false }
);

readerText.addEventListener("scroll", function() {
    /*
        IMPORTANT:
        Do not stop the auto-reader from the scroll event.
        scrollTop writes from requestAnimationFrame can dispatch
        their scroll event asynchronously, after the programmatic
        flag has already been cleared. Pointer events are the
        reliable signal for a human touch/mouse gesture.
    */
    readerScrollPosition = readerText.scrollTop;
    updateReaderUI();

    const maxScroll =
        Math.max(
            0,
            readerText.scrollHeight - readerText.clientHeight
        );

    const atEnd =
        maxScroll > 0 &&
        readerScrollPosition >= maxScroll - 2;

    if (atEnd && !readerComplete) {
        finishReader();
        return;
    }

    if (
        !readerProgrammaticScroll &&
        readerPaused
    ) {
        readerStatus.textContent = "PAUSED";
    }

    const now = performance.now();
    if (
        !readerProgrammaticScroll &&
        now - lastReaderSaveTime > 700
    ) {
        saveReaderPosition(now);
    }
});

readerPause.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();


        if (
            !currentBook
        ) {

            return;
        }


        /*
            COMPLETE → READ AGAIN
        */

        if (
            readerComplete
        ) {

            clearReaderPosition();

            openReader();

            return;
        }


        /*
            PAUSE
        */

        if (
            !readerPaused
        ) {

            readerPaused = true;

            clearReaderManualResumeTimer();
            readerManualInteraction = false;
            stopReaderAnimation();

            readerPause.textContent = "RESUME";
            readerStatus.textContent = "PAUSED";

            return;
        }


        /*
            RESUME

            Resume through the same single start path used by
            opening the reader and ending a manual drag.
        */

        readerPaused = false;

        readerPause.textContent = "PAUSE";

        startReaderAnimation(0, readerOpenToken);
    }
);


/* =================================================
   READER FULL SCREEN
================================================= */

function makeReaderControlMovable(element, savePosition, onTap) {
    let dragging = false;
    let pointerId = null;
    let moved = false;
    let offsetX = 0;
    let offsetY = 0;
    let startPointerX = 0;
    let startPointerY = 0;
    let startLeft = 0;
    let startTop = 0;

    function clampPosition(left, top) {
        const panelRect = readerPanel.getBoundingClientRect();
        const elementRect = element.getBoundingClientRect();
        const padding = 6;

        const maxLeft = Math.max(
            padding,
            panelRect.width - elementRect.width - padding
        );

        const maxTop = Math.max(
            padding,
            panelRect.height - elementRect.height - padding
        );

        return {
            left: Math.max(padding, Math.min(maxLeft, left)),
            top: Math.max(padding, Math.min(maxTop, top))
        };
    }

    element.addEventListener("pointerdown", function(e) {
        if (
            e.pointerType === "mouse" &&
            e.button !== 0
        ) {
            return;
        }

        e.preventDefault();
        e.stopPropagation();

        const rect = element.getBoundingClientRect();
        const panelRect = readerPanel.getBoundingClientRect();

        dragging = true;
        moved = false;
        pointerId = e.pointerId;

        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        startPointerX = e.clientX;
        startPointerY = e.clientY;

        startLeft = rect.left - panelRect.left;
        startTop = rect.top - panelRect.top;

        element.classList.add("dragging");

        try {
            element.setPointerCapture(e.pointerId);
        } catch (_) {}
    }, { passive: false });

    element.addEventListener("pointermove", function(e) {
        if (!dragging || e.pointerId !== pointerId) {
            return;
        }

        const dx = e.clientX - startPointerX;
        const dy = e.clientY - startPointerY;

        if (
            Math.abs(dx) > 5 ||
            Math.abs(dy) > 5
        ) {
            moved = true;
        }

        if (!moved) {
            return;
        }

        e.preventDefault();
        e.stopPropagation();

        const position = clampPosition(
            startLeft + dx,
            startTop + dy
        );

        element.style.left = position.left + "px";
        element.style.top = position.top + "px";
        element.style.right = "auto";
        element.style.bottom = "auto";
    }, { passive: false });

    function end(e) {
        if (!dragging) {
            return;
        }

        if (
            e &&
            e.pointerId !== pointerId
        ) {
            return;
        }

        const wasMoved = moved;

        if (e && wasMoved) {
            e.preventDefault();
            e.stopPropagation();
        }

        dragging = false;
        element.classList.remove("dragging");

        try {
            element.releasePointerCapture(pointerId);
        } catch (_) {}

        pointerId = null;

        if (wasMoved) {
            savePosition();
        } else if (typeof onTap === "function") {
            onTap();
        }
    }

    element.addEventListener("pointerup", end, { passive: false });
    element.addEventListener("pointercancel", end, { passive: false });
}

window.addEventListener(

    function() {
        if (

        ) {

        }

        const panelRect = readerPanel.getBoundingClientRect();
        const buttonRect = readerFullscreen.getBoundingClientRect();
        const padding = 6;

        let left = parseFloat(readerFullscreen.style.left);
        let top = parseFloat(readerFullscreen.style.top);

        if (!Number.isFinite(left)) left = padding;
        if (!Number.isFinite(top)) top = padding;

        left = Math.max(
            padding,
            Math.min(
                Math.max(
                    padding,
                    panelRect.width - buttonRect.width - padding
                ),
                left
            )
        );

        top = Math.max(
            padding,
            Math.min(
                Math.max(
                    padding,
                    panelRect.height - buttonRect.height - padding
                ),
                top
            )
        );

        readerFullscreen.style.left = left + "px";
        readerFullscreen.style.top = top + "px";
    }
);

function isReaderFullscreen() {
    return (
        document.fullscreenElement === document.documentElement ||
        document.webkitFullscreenElement === document.documentElement
    );
}

function updateReaderFullscreenUI() {
    const button = document.getElementById("readerFullscreen");
    if (!button) return;

    const active = isReaderFullscreen();

    document.documentElement.classList.toggle(
        "cican-device-fullscreen",
        active
    );

    button.textContent = active
        ? "EXIT FULL SCREEN"
        : "FULL SCREEN";

    button.setAttribute(
        "aria-label",
        active
            ? "Exit device full screen"
            : "Enter device full screen"
    );

    button.setAttribute(
        "aria-pressed",
        active ? "true" : "false"
    );
}

async function toggleReaderFullscreen() {
    if (!reader.classList.contains("open")) return;

    try {
        if (isReaderFullscreen()) {
            if (document.exitFullscreen) {
                await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        } else if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen({
                navigationUI: "hide"
            });
        } else if (document.documentElement.webkitRequestFullscreen) {
            document.documentElement.webkitRequestFullscreen();
        } else {
            throw new Error("Device fullscreen API unavailable");
        }
    } catch (error) {
        document.documentElement.classList.remove("cican-device-fullscreen");
        console.warn("CICAN device full-screen request was not available.", error);
        return;
    }

    updateReaderFullscreenUI();
}

document.addEventListener("fullscreenchange", updateReaderFullscreenUI);
document.addEventListener("fullscreenerror", function() {
    document.documentElement.classList.remove("cican-device-fullscreen");
    updateReaderFullscreenUI();
});
window.addEventListener("pageshow", updateReaderFullscreenUI);

if (document.webkitFullscreenElement !== undefined) {
    document.addEventListener("webkitfullscreenchange", updateReaderFullscreenUI);
}

/* =================================================
   CLOSE READER
================================================= */

function closeReader() {

    reader.classList.remove("text-only-fullscreen");
    document.documentElement.classList.remove("cican-device-fullscreen");

    if (isReaderFullscreen()) {
        try {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        } catch (_) {}
    }

    readerOpenToken += 1;

    stopReaderAnimation();

    clearReaderManualResumeTimer();
    readerManualInteraction = false;

    saveReaderPosition(
        performance.now()
    );

    stopReaderAnimation();


    readerPaused =
        false;


    readerComplete =
        false;


    readerSeconds =
        TARGET_READING_SECONDS;


    readerScrollPosition =
        0;


    readerText.textContent =
        "";


    readerText.scrollTop =
        0;


    reader.classList.remove(
        "open"
    );


    readerPause.textContent =
        "PAUSE";


    readerStatus.textContent =
        "AUTO-READING";
}

                hudRect.width -
                padding
            );


        const maxTop =
            Math.max(
                padding,
                panelRect.height -
                hudRect.height -

/* =================================================
   READER VIEWPORT RESILIENCE
================================================= */

let readerResizeFrame = null;

window.addEventListener("resize", function() {
    if (!reader.classList.contains("open") || !currentBook) return;

    const previousMaxScroll = Math.max(
        0,
        readerText.scrollHeight - readerText.clientHeight
    );

    const previousPosition = Math.max(
        0,
        Math.min(readerText.scrollTop, previousMaxScroll)
    );

    const progress = previousMaxScroll > 0
        ? previousPosition / previousMaxScroll
        : 0;

    if (readerResizeFrame !== null) {
        cancelAnimationFrame(readerResizeFrame);
    }

    readerResizeFrame = requestAnimationFrame(function() {
        readerResizeFrame = null;

        const nextMaxScroll = Math.max(
            0,
            readerText.scrollHeight - readerText.clientHeight
        );

        readerScrollPosition = Math.min(
            Math.max(0, nextMaxScroll * progress),
            nextMaxScroll
        );

        readerText.scrollTop = readerScrollPosition;
        updateReaderUI();
        saveReaderPosition(performance.now());
    });
});
