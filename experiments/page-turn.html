<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CICAN Books — Page Turn Experiment</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Georgia,"Times New Roman",serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}#app{width:min(900px,100vw);height:100dvh;display:flex;flex-direction:column}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:700 11px Arial,sans-serif;letter-spacing:.18em}
#book{position:relative;flex:1;min-height:0;padding:10px 12px 24px;perspective:1400px}
.page{position:absolute;inset:10px 12px 24px;background:#050505;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 60px rgba(0,0,0,.65);overflow:hidden;transform-origin:left center;backface-visibility:hidden;transition:transform .55s cubic-bezier(.22,.72,.2,1),opacity .55s ease}
.page.next{transform:rotateY(0);z-index:2}.page.turn-next{transform:rotateY(-178deg);opacity:.18}.page.prev{transform:rotateY(0);z-index:1}.page.turn-prev{transform-origin:right center;transform:rotateY(178deg);opacity:.18}
.paper{height:100%;overflow:auto;padding:clamp(30px,6vw,70px) clamp(24px,8vw,90px);scrollbar-width:none}.paper::-webkit-scrollbar{display:none}
.paper h1{font-size:clamp(20px,4vw,34px);font-weight:400;line-height:1.25;margin:0 0 28px}.paper p{font-size:clamp(18px,2.8vw,25px);line-height:1.72;margin:0 0 1.15em}
.pageNo{position:absolute;bottom:12px;left:0;right:0;text-align:center;font:700 9px Arial,sans-serif;letter-spacing:.2em;color:rgba(255,255,255,.38)}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:10px Arial,sans-serif;letter-spacing:.14em;color:rgba(255,255,255,.34);pointer-events:none}
#status{font:700 10px Arial,sans-serif;letter-spacing:.16em;color:rgba(255,255,255,.55)}
</style></head>
<body><div id="app">
<header class="top"><span>CICAN</span><span id="status">PAGE 1 / 8</span><span>PAGE TURN EXPERIMENT</span></header>
<main id="book" aria-label="CICAN page turn experiment">
<section class="page next" id="pageA"><div class="paper"></div><div class="pageNo"></div></section>
<section class="page prev" id="pageB"><div class="paper"></div><div class="pageNo"></div></section>
<div class="hint">SWIPE LEFT / RIGHT &nbsp; • &nbsp; TAP EDGES</div></main></div>
<script>
const pages=[
["TAO TE CHING","The Tao that can be expressed in words is not the eternal Tao. The name that can be named is not the eternal Name. The nameless is the beginning of heaven and earth; the named is the mother of ten thousand things."],
["PAGE TWO","Therefore always be without desire in order to observe its wondrous subtleties; always have desire, so that you may observe its boundaries. These two are the same in source but differ when they appear."],
["PAGE THREE","Being and non-being produce each other. Difficult and easy complete each other. Long and short contrast each other. High and low depend on each other. Before and after follow one another."],
["PAGE FOUR","The sage does not speak of the Way as something distant. He follows what is natural, does not force the course of things, and lets the work be completed without claiming possession."],
["PAGE FIVE","The Way is empty, yet its use cannot be exhausted. It is deep, seemingly the source of all things. It blunts sharpness, untangles confusion, softens the glare, and joins itself to the dust."],
["PAGE SIX","Heaven and earth are impartial. They regard the ten thousand things as straw dogs. The sage is impartial. He regards the people as straw dogs. The space between heaven and earth is like a bellows: empty, yet inexhaustible."],
["PAGE SEVEN","Knowing others is intelligence; knowing yourself is true wisdom. Mastering others is strength; mastering yourself is true power. If you are satisfied with what you have, you can be rich."],
["PAGE EIGHT","A journey of a thousand miles begins beneath one's feet. What is firmly planted cannot be pulled up easily. What is embraced with care will endure. The work is complete when it is allowed to become complete."]
];
let index=0,turning=false,startX=0,startY=0,moved=false;
const A=document.getElementById("pageA"),B=document.getElementById("pageB"),book=document.getElementById("book"),status=document.getElementById("status");
function fill(el,i){const p=pages[i];el.querySelector(".paper").innerHTML=p?"<h1>"+p[0]+"</h1><p>"+p[1]+"</p>":"";el.querySelector(".pageNo").textContent=p?"PAGE "+(i+1)+" / "+pages.length:"";}
function render(){fill(A,index);fill(B,index);A.className="page next";B.className="page prev";status.textContent="PAGE "+(index+1)+" / "+pages.length;}
function turn(dir){
 if(turning||dir>0&&index>=pages.length-1||dir<0&&index<=0)return;
 turning=true;const outgoing=dir>0?A:B,incoming=dir>0?B:A,next=index+dir;
 fill(incoming,next);incoming.style.zIndex=dir>0?"1":"2";outgoing.style.zIndex=dir>0?"2":"1";
 requestAnimationFrame(()=>outgoing.classList.add(dir>0?"turn-next":"turn-prev"));
 setTimeout(()=>{index=next;render();turning=false},570);
}
book.addEventListener("pointerdown",e=>{startX=e.clientX;startY=e.clientY;moved=false});
book.addEventListener("pointermove",e=>{if(Math.hypot(e.clientX-startX,e.clientY-startY)>12)moved=true});
book.addEventListener("pointerup",e=>{
 if(turning)return;const dx=e.clientX-startX,dy=e.clientY-startY;
 if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.15){turn(dx<0?1:-1);return}
 if(!moved){const r=book.getBoundingClientRect();turn(e.clientX<r.left+r.width/2?-1:1)}
});
render();
</script></body></html>
