<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>CICAN Books — Continuous Paper Curl Experiment</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Georgia,"Times New Roman",serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}#app{width:min(900px,100vw);height:100dvh;display:flex;flex-direction:column}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:700 11px Arial,sans-serif;letter-spacing:.18em}
#book{position:relative;flex:1;min-height:0;padding:10px 12px 24px;touch-action:none;overflow:hidden}
.paper{position:absolute;inset:10px 12px 24px;background:#050505;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 60px rgba(0,0,0,.65);overflow:hidden}
.paperContent{height:100%;overflow:hidden;padding:clamp(30px,6vw,70px) clamp(24px,8vw,90px)}
.paperContent h1{font-size:clamp(20px,4vw,34px);font-weight:400;line-height:1.25;margin:0 0 28px}.paperContent p{font-size:clamp(18px,2.8vw,25px);line-height:1.72;margin:0 0 1.15em}
#under{z-index:1}#curlCanvas{position:absolute;inset:10px 12px 24px;width:calc(100% - 24px);height:calc(100% - 34px);z-index:3;display:block;touch-action:none}
#shade{position:absolute;inset:10px 12px 24px;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 68% 50%,rgba(255,255,255,.16),rgba(0,0,0,.52) 34%,rgba(0,0,0,0) 62%);mix-blend-mode:screen}
.pageNo{position:absolute;bottom:12px;left:0;right:0;text-align:center;font:700 9px Arial,sans-serif;letter-spacing:.2em;color:rgba(255,255,255,.38);z-index:6}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:10px Arial,sans-serif;letter-spacing:.14em;color:rgba(255,255,255,.34);pointer-events:none;z-index:8}
#status{font:700 10px Arial,sans-serif;letter-spacing:.16em;color:rgba(255,255,255,.55)}
</style>
<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPosition; attribute vec2 aUV;
uniform float uProgress,uDirection,uAspect,uCurling;
varying vec2 vUV; varying float vCurve,vSide;
void main(){
 float x=aPosition.x,y=aPosition.y,p=max(uProgress,0.0001);
 float fold=(uDirection>0.0)?(1.0-p):p;
 float local=(uDirection>0.0)?max(0.0,(x-fold)/p):max(0.0,(fold-x)/p);
 local=min(local,1.0);
 float theta=local*3.14159265;
 float radius=max(p,0.0001)/3.14159265;
 float cx=x,z=0.0;
 if(uProgress>0.0005){
   float arcX=radius*sin(theta);
   cx=(uDirection>0.0)?fold+arcX:fold-arcX;
   z=radius*(1.0-cos(theta));
 }
 float wave=sin(x*3.14159265)*sin(y*3.14159265)*0.012*uCurling;
 float xx=(cx-0.5)*2.0,yy=(0.5-y)*2.0+wave;
 float perspective=1.0+z*1.15;
 gl_Position=vec4(xx/uAspect/perspective,yy/perspective,z*0.9-0.001,1.0);
 vUV=aUV;vCurve=local;vSide=z;
}
</script>
<script id="fs" type="x-shader/x-fragment">
precision mediump float;
varying vec2 vUV;varying float vCurve,vSide;uniform sampler2D uTexture;
void main(){
 vec4 c=texture2D(uTexture,vUV);
 float light=0.92+0.18*sin(vCurve*3.14159265);
 float shadow=1.0-0.34*vCurve;
 c.rgb*=light*shadow;c.rgb+=vec3(.08)*vCurve;
 gl_FragColor=c;
}
</script>
</head>
<body><div id="app">
<header class="top"><span>CICAN</span><span id="status">PAGE 1 / 8</span><span>PHYSICAL PAPER EXPERIMENT</span></header>
<main id="book" aria-label="CICAN continuous physical paper curl experiment">
<section id="under" class="paper"><div id="underContent" class="paperContent"></div></section>
<canvas id="curlCanvas"></canvas><div id="shade"></div>
<div id="pageNo" class="pageNo"></div><div class="hint">PRESS &amp; HOLD • MOVE SLOWLY • THE SHEET FOLLOWS YOUR FINGER</div>
</main></div>
<script>
const pages=[
["TAO TE CHING","The Tao that can be expressed in words is not the eternal Tao. The name that can be named is not the eternal Name. The nameless is the beginning of heaven and earth; the named is the mother of ten thousand things."],
["PAGE TWO","Therefore always be without desire in order to observe its wondrous subtleties; always have desire, so that you may observe its boundaries. These two are the same in source but differ when they appear."],
["PAGE THREE","Being and non-being produce each other. Difficult and easy complete each other. Long and short contrast each other. High and low depend on each other. Before and after follow one another."],
["PAGE FOUR","The sage does not speak of the Way as something distant. He follows what is natural, does not force the course of things, and lets the work be completed without claiming possession."],
["PAGE FIVE","The Way is empty, yet its use cannot be exhausted. It is deep, seemingly the source of all things. It blunts sharpness, untangles confusion, softens the glare, and joins itself to the dust."],
["PAGE SIX","Heaven and earth are impartial. They regard the ten thousand things as straw dogs. The sage is impartial. He regards the people as straw dogs. The space between heaven and earth is like a bellows: empty, yet inexhaustible."],
["PAGE SEVEN","Knowing others is intelligence; knowing yourself is true wisdom. Mastering others is strength; mastering yourself is true power. If you are satisfied with what you have, you can be rich."],
["PAGE EIGHT","A journey of a thousand miles begins beneath one's feet. What is firmly planted cannot be pulled up easily. What is embraced with care will endure. The work is complete when it is allowed to become complete."]
];
const book=document.getElementById("book"),canvas=document.getElementById("curlCanvas"),gl=canvas.getContext("webgl",{alpha:true,antialias:true});
const underContent=document.getElementById("underContent"),status=document.getElementById("status"),pageNo=document.getElementById("pageNo"),shade=document.getElementById("shade");
let index=0,drag=null,texture,program,posBuf,uvBuf,posLoc,uvLoc,uProgress,uDirection,uAspect,uCurling,uTexture;
const COLS=80,ROWS=30;
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function htmlFor(i){const p=pages[i];return p?'<h1>'+esc(p[0])+'</h1><p>'+esc(p[1])+'</p>':'';}
function renderUnder(i){underContent.innerHTML=htmlFor(i);status.textContent="PAGE "+(i+1)+" / "+pages.length;pageNo.textContent="PAGE "+(i+1)+" / "+pages.length;}
function makeTexture(i){
 const d=Math.min(2,devicePixelRatio||1),w=Math.max(900,Math.round(canvas.clientWidth*d)),h=Math.max(1200,Math.round(canvas.clientHeight*d)),c=document.createElement("canvas");c.width=w;c.height=h;
 const x=c.getContext("2d"),p=pages[i],px=w*.10,top=h*.075,max=w-px*2;
 x.fillStyle="#050505";x.fillRect(0,0,w,h);x.strokeStyle="rgba(255,255,255,.12)";x.strokeRect(1,1,w-2,h-2);x.fillStyle="#fff";
 x.font="400 "+Math.round(Math.min(68,w*.04))+"px Georgia";x.fillText(p[0],px,top+45);x.font="400 "+Math.round(Math.min(50,w*.028))+"px Georgia";
 const words=p[1].split(/\s+/);let line="",y=top+115,lh=Math.round(Math.min(86,w*.048));
 for(const word of words){const t=line?line+" "+word:word;if(x.measureText(t).width>max&&line){x.fillText(line,px,y);line=word;y+=lh}else line=t}if(line)x.fillText(line,px,y);return c;
}
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
function initGL(){
 if(!gl)return;const vs=shader(gl.VERTEX_SHADER,document.getElementById("vs").textContent),fs=shader(gl.FRAGMENT_SHADER,document.getElementById("fs").textContent);
 program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
 posLoc=gl.getAttribLocation(program,"aPosition");uvLoc=gl.getAttribLocation(program,"aUV");uProgress=gl.getUniformLocation(program,"uProgress");uDirection=gl.getUniformLocation(program,"uDirection");uAspect=gl.getUniformLocation(program,"uAspect");uCurling=gl.getUniformLocation(program,"uCurling");uTexture=gl.getUniformLocation(program,"uTexture");
 const pos=[],uv=[];for(let r=0;r<ROWS;r++){const y=r/(ROWS-1);for(let c=0;c<COLS;c++){const xx=c/(COLS-1);pos.push(xx,y);uv.push(xx,1-y)}}
 posBuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pos),gl.STATIC_DRAW);
 uvBuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,uvBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(uv),gl.STATIC_DRAW);
 texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
}
function uploadPage(i){if(!gl)return;const c=makeTexture(i);gl.bindTexture(gl.TEXTURE_2D,texture);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);draw(0,1,false);}
function draw(p,dir,curl){
 gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);
 gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);gl.enableVertexAttribArray(posLoc);gl.vertexAttribPointer(posLoc,2,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,uvBuf);gl.enableVertexAttribArray(uvLoc);gl.vertexAttribPointer(uvLoc,2,gl.FLOAT,false,0,0);
 gl.uniform1f(uProgress,p);gl.uniform1f(uDirection,dir);gl.uniform1f(uAspect,canvas.width/canvas.height);gl.uniform1f(uCurling,curl?1:0);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);gl.uniform1i(uTexture,0);
 for(let r=0;r<ROWS-1;r++)gl.drawArrays(gl.TRIANGLE_STRIP,r*COLS,COLS);
}
function resize(){const d=Math.min(2,devicePixelRatio||1);canvas.width=Math.max(1,Math.round(canvas.clientWidth*d));canvas.height=Math.max(1,Math.round(canvas.clientHeight*d));if(gl)uploadPage(index);}
function setPage(i){index=i;renderUnder(i);resize();}
function prepare(dir){const n=index+dir;if(n<0||n>=pages.length)return false;renderUnder(n);uploadPage(index);return true;}
function apply(p,dir){draw(p,dir,true);shade.style.opacity=String(Math.min(.38,p*.75));}
function finish(dir,commit,start){
 const target=commit?1:0,t0=performance.now();
 function frame(now){const q=Math.min(1,(now-t0)/380),e=1-Math.pow(1-q,3);apply(start+(target-start)*e,dir);if(q<1)requestAnimationFrame(frame);else{if(commit)setPage(index+dir);else{renderUnder(index);resize();}drag=null;shade.style.opacity="0";}}
 requestAnimationFrame(frame);
}
function down(e){if(drag||(e.pointerType==="mouse"&&e.button!==0))return;const r=canvas.getBoundingClientRect();drag={id:e.pointerId,x:e.clientX-r.left,y:e.clientY-r.top,dir:0,p:0};canvas.setPointerCapture?.(e.pointerId);}
function move(e){if(!drag)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,dx=x-drag.x,dy=y-drag.y;if(!drag.dir){if(Math.abs(dx)<2||Math.abs(dx)<Math.abs(dy)*.7)return;drag.dir=dx<0?1:-1;if(!prepare(drag.dir)){drag=null;return;}}drag.p=Math.max(0,Math.min(1,Math.abs(dx)/Math.max(1,r.width)));apply(drag.p,drag.dir);}
function up(){if(!drag)return;const d=drag;finish(d.dir,d.p>.20,d.p);}
if(gl){try{initGL();}catch(e){console.error(e)}}
function start(){renderUnder(index);resize();}
window.addEventListener("resize",()=>requestAnimationFrame(start));
canvas.addEventListener("pointerdown",down);canvas.addEventListener("pointermove",move);canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);start();
</script>
</body></html>
