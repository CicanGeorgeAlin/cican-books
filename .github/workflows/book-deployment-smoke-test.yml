name: CICAN Books deployment smoke test

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Wait for GitHub Pages to serve this deployment
        run: |
          set -euo pipefail
          for i in {1..18}; do
            if curl -L --fail --silent --show-error --max-time 20 https://cicangeorgealin.github.io/cican-books/ -o site.html; then
              echo "CICAN BOOKS is reachable."
              break
            fi
            echo "Waiting for GitHub Pages..."
            sleep 10
          done
          test -s site.html

      - name: Install Chromium
        run: |
          npm install --no-save --prefix .smoke-test-deps playwright@1.55.0
          npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Test the live library and every PUBLIC book
        run: |
          set -euo pipefail
          cat > smoke-test.cjs <<'JS'
          const { chromium } = require("playwright");
          (async () => {

          const BASE = "https://cicangeorgealin.github.io/cican-books/";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();

          try {
            await page.goto(BASE, { waitUntil: "networkidle", timeout: 60000 });

            const publicBooks = await page.evaluate(async () => {
              const mod = await import("./catalog/index.js?smoke=" + Date.now());
              return mod.CATALOG.filter(b => b.visibility === "PUBLIC").map(b => ({
                id: b.id,
                title: b.title
              }));
            });

            if (!publicBooks.length) throw new Error("No PUBLIC books found.");

            for (const book of publicBooks) {
              await page.goto(BASE, { waitUntil: "networkidle", timeout: 60000 });

              const button = page.locator("a.book").filter({ hasText: book.title }).first();
              await button.waitFor({ state: "visible", timeout: 30000 });
              await button.click();

              await page.waitForURL(
                url => url.searchParams.get("book") === book.id,
                { timeout: 30000 }
              );

              await page.waitForFunction(
                () => document.querySelector("#reader")?.classList.contains("open"),
                null,
                { timeout: 30000 }
              );

              const result = await page.evaluate(() => ({
                title: document.querySelector("#readerTitle")?.textContent?.trim() || "",
                text: document.querySelector("#readerText")?.textContent?.trim() || "",
                status: document.querySelector("#readerStatus")?.textContent?.trim() || ""
              }));

              if (!result.title) throw new Error("Reader title did not load for " + book.id);
              if (!result.text) throw new Error("Reader text did not load for " + book.id);

              if (!result.title.toUpperCase().includes(book.title.toUpperCase().replace(/^THE /,"THE "))) throw new Error("Reader title mismatch for " + book.id);
              console.log("PASS:", book.id, "| catalog link → reader → book text loaded");
            }

            console.log("PASS:", publicBooks.length, "PUBLIC books opened successfully in Chromium.");
            await import("node:fs/promises").then(fs => fs.writeFile(
              "smoke-test-result.json",
              JSON.stringify({
                result: "PASS",
                testedCommit: process.env.GITHUB_SHA,
                testedAt: new Date().toISOString(),
                publicBooks: publicBooks.map(b => b.id)
              }, null, 2) + "\n"
            ));
          } finally {
            await browser.close();
          }
          })();
          JS
          NODE_PATH="$GITHUB_WORKSPACE/.smoke-test-deps/node_modules" node smoke-test.cjs

      - name: Record successful deployment smoke test
        if: success()
        run: |
          set -euo pipefail
          git config user.name "CICAN Books Smoke Test"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smoke-test-result.json
          git diff --cached --quiet && exit 0
          git commit -m "Record deployment smoke test result [skip ci]"
          git push
