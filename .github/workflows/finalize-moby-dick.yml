name: Finalize Moby Dick
on:
  push:
    paths:
      - ".github/workflows/finalize-moby-dick.yml"
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('books/moby-dick.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('readerSourceStatus: "SOURCE_PENDING",','readerSourceStatus: "SOURCE_READY",')
          s=s.replace('sourceNote: "Complete source asset is not currently stored and verified in the repository. FULL BOOK remains unavailable until acquisition is complete.",','fullTextUrl: "fulltext/moby-dick.txt",\n  fullTextSourceType: "COMPLETE_SOURCE_ASSET",\n  fullTextSourceVerified: true,\n  fullBookReady: true,\n  fifteenMinuteStartMarker: "CHAPTER I.",\n  sourceNote: "Complete Moby Dick source is stored locally in fulltext/moby-dick.txt. The 15 MIN reader is calibrated directly from the verified source beginning at CHAPTER I; FULL BOOK uses the same complete source asset.",')
          p.write_text(s,encoding='utf-8')
          q=Path('catalog/index.js')
          c=q.read_text(encoding='utf-8')
          c=c.replace('fullBookReady:false, sourceRepo:"Project Gutenberg", sourceEbookId:"15"','fullBookReady:true, sourceRepo:"Project Gutenberg", sourceEbookId:"15"')
          q.write_text(c,encoding='utf-8')
          PY
          node --check books/moby-dick.js
          python - <<'PY'
          from pathlib import Path
          s=Path('fulltext/moby-dick.txt').read_text(encoding='utf-8')
          assert len(s.split()) > 100000
          assert 'Call me Ishmael' in s
          assert 'THE END' in s.upper()
          print('Moby Dick metadata and complete source verification passed')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/acquire-moby-dick.yml .github/workflows/finalize-moby-dick.yml
          git add books/moby-dick.js catalog/index.js
          git commit -m 'Finalize Moby Dick source-ready integration'
          git push