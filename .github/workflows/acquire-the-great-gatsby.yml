name: Acquire The Great Gatsby Complete Text

on:
  push:
    paths:
      - ".github/workflows/acquire-the-great-gatsby.yml"

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download complete source
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from pathlib import Path

          url = "https://www.gutenberg.org/cache/epub/64317/pg64317.txt"
          raw = urlopen(url, timeout=60).read().decode("utf-8")
          start = raw.find("*** START OF THE PROJECT GUTENBERG EBOOK")
          end = raw.find("*** END OF THE PROJECT GUTENBERG EBOOK")
          if start < 0 or end <= start:
              raise SystemExit("Project Gutenberg wrapper markers not found")
          body = raw[raw.find("\n", start) + 1:end].strip()
          Path("fulltext/the-great-gatsby.txt").write_text(body + "\n", encoding="utf-8")
          print("characters:", len(body))
          print("words:", len(body.split()))
          PY

      - name: Verify complete source
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("fulltext/the-great-gatsby.txt").read_text(encoding="utf-8")
          required = [
              "The Great Gatsby",
              "Chapter I.",
              "Chapter IX.",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"Missing required marker: {marker}")
          if len(text) < 100000:
              raise SystemExit("Source unexpectedly short")
          print("The Great Gatsby complete-source verification passed")
          PY

      - name: Publish asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fulltext/the-great-gatsby.txt
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "Add The Great Gatsby complete source asset"
          git push
