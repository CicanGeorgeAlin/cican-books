name: Acquire Moby Dick Complete Text
on:
  push:
    paths:
      - ".github/workflows/acquire-moby-dick.yml"
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify complete source
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from pathlib import Path
          url='https://www.gutenberg.org/cache/epub/2701/pg2701.txt'
          raw=urlopen(url,timeout=60).read().decode('utf-8')
          start=raw.find('*** START OF THE PROJECT GUTENBERG EBOOK')
          end=raw.find('*** END OF THE PROJECT GUTENBERG EBOOK')
          if start<0 or end<=start: raise SystemExit('Gutenberg wrapper markers not found')
          body=raw[raw.find('\n',start)+1:end].strip()
          Path('fulltext/moby-dick.txt').write_text(body+'\n',encoding='utf-8')
          assert len(body.split())>100000
          assert 'Moby-Dick' in body and 'The Whale' in body
          assert 'Loomings' in body
          assert 'The Chase' in body
          print('Moby Dick complete source verified',len(body),len(body.split()))
          PY
      - name: Publish asset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fulltext/moby-dick.txt
          git commit -m "Add Moby Dick complete source asset"
          git push