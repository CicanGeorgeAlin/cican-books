name: CICAN Books Autopilot Gate

on:
  workflow_dispatch:
  push:
    paths:
      - "catalog/**"
      - "books/**"
      - "qa/autopilot-gate.mjs"
      - "qa/source-integrity.mjs"
      - "reader.html"
      - "index.html"
      - "sitemap.xml"
      - "qa/validate-cican-books.mjs"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run book autopilot gate
        run: node qa/autopilot-gate.mjs
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete reader QA
        run: node qa/test-reader-books.mjs