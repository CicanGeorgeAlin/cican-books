name: Acquire missing complete public-domain texts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  acquire:
    if: github.event.head_commit.message != 'Mirror missing complete public-domain texts'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download verified Gutenberg sources
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --silent --show-error https://www.gutenberg.org/cache/epub/11/pg11.txt -o fulltext/alice-adventures-in-wonderland.txt
          curl -L --fail --retry 3 --silent --show-error https://www.gutenberg.org/cache/epub/48320/pg48320.txt -o fulltext/adventures-of-sherlock-holmes.txt
          curl -L --fail --retry 3 --silent --show-error https://www.gutenberg.org/cache/epub/2554/pg2554.txt -o fulltext/crime-and-punishment.txt
          curl -L --fail --retry 3 --silent --show-error https://www.gutenberg.org/cache/epub/98/pg98.txt -o fulltext/a-tale-of-two-cities.txt
          curl -L --fail --retry 3 --silent --show-error https://www.gutenberg.org/cache/epub/174/pg174.txt -o fulltext/the-picture-of-dorian-gray.txt
          curl -L --fail --retry 3 --silent --show-error https://www.gutenberg.org/cache/epub/1184/pg1184.txt -o fulltext/the-count-of-monte-cristo.txt
          curl -L --fail --retry 3 --silent --show-error https://www.gutenberg.org/cache/epub/1257/pg1257.txt -o fulltext/the-three-musketeers.txt
          curl -L --fail --retry 3 --silent --show-error https://www.gutenberg.org/cache/epub/74/pg74.txt -o fulltext/the-adventures-of-tom-sawyer.txt
          curl -L --fail --retry 3 --silent --show-error https://www.gutenberg.org/cache/epub/76/pg76.txt -o fulltext/adventures-of-huckleberry-finn.txt
          curl -L --fail --retry 3 --silent --show-error https://www.gutenberg.org/cache/epub/37106/pg37106.txt -o fulltext/little-women.txt
          curl -L --fail --retry 3 --silent --show-error https://www.gutenberg.org/cache/epub/113/pg113.txt -o fulltext/the-secret-garden.txt
          curl -L --fail --retry 3 --silent --show-error https://www.gutenberg.org/cache/epub/1661/pg1661.txt -o fulltext/the-adventures-of-sherlock-holmes.txt
          test $(wc -c < fulltext/alice-adventures-in-wonderland.txt) -gt 10000
          test $(wc -c < fulltext/adventures-of-sherlock-holmes.txt) -gt 10000
          test $(wc -c < fulltext/crime-and-punishment.txt) -gt 10000
          test $(wc -c < fulltext/a-tale-of-two-cities.txt) -gt 10000
          test $(wc -c < fulltext/the-picture-of-dorian-gray.txt) -gt 10000
          test $(wc -c < fulltext/the-count-of-monte-cristo.txt) -gt 10000
          test $(wc -c < fulltext/the-three-musketeers.txt) -gt 10000
          test $(wc -c < fulltext/the-adventures-of-tom-sawyer.txt) -gt 10000
          test $(wc -c < fulltext/adventures-of-huckleberry-finn.txt) -gt 10000
          test $(wc -c < fulltext/little-women.txt) -gt 10000
          test $(wc -c < fulltext/the-secret-garden.txt) -gt 10000
          test $(wc -c < fulltext/the-adventures-of-sherlock-holmes.txt) -gt 10000
      - name: Commit mirrored sources
        run: |
          git config user.name "CICAN Books Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fulltext/the-secret-garden.txt fulltext/the-picture-of-dorian-gray.txt fulltext/alice-adventures-in-wonderland.txt fulltext/adventures-of-sherlock-holmes.txt fulltext/crime-and-punishment.txt fulltext/a-tale-of-two-cities.txt fulltext/the-three-musketeers.txt fulltext/the-count-of-monte-cristo.txt fulltext/the-adventures-of-tom-sawyer.txt fulltext/adventures-of-huckleberry-finn.txt fulltext/little-women.txt
          git diff --cached --quiet && exit 0
          git commit -m "Mirror missing complete public-domain texts"
          git push
