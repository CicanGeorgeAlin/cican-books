name: Finalize The Great Gatsby

on:
  push:
    paths:
      - ".github/workflows/finalize-gatsby.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize Gatsby metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          book = Path("books/the-great-gatsby.js")
          text = book.read_text(encoding="utf-8")
          text = text.replace('readerSourceStatus: "SOURCE_PENDING",', '''readerSourceStatus: "SOURCE_READY",

              fullTextUrl: "fulltext/the-great-gatsby.txt",

              fullTextSourceType: "COMPLETE_SOURCE_ASSET",

              fullTextSourceVerified: true,

              fullBookReady: true,

              fifteenMinuteStartMarker: "In my younger and more vulnerable years",

              sourceEdition: "Project Gutenberg eBook #64317, 1925 text",

              sourceUrl: "https://www.gutenberg.org/ebooks/64317",

              sourceNote:
                  "Complete The Great Gatsby source is stored locally in fulltext/the-great-gatsby.txt. The 15 MIN reader is calibrated directly from the verified source beginning with the novel opening; FULL BOOK uses the same complete source asset.",''')
          start = text.find("    text:")
          end = text.find("\n\n};", start)
          if start >= 0 and end > start:
              text = text[:start] + "\n};\n"
          book.write_text(text, encoding="utf-8")

          catalog = Path("catalog/index.js")
          c = catalog.read_text(encoding="utf-8")
          old = '{ id:"the-great-gatsby", title:"THE GREAT GATSBY", author:"F. Scott Fitzgerald", category:"Classic Fiction", translator:"", targetMinutes:15, status:"CONTENT_REVIEW", fullBookReady:false, bookSource:"books/the-great-gatsby.js" },'
          new = '{ id:"the-great-gatsby", title:"THE GREAT GATSBY", author:"F. Scott Fitzgerald", category:"Classic Fiction", translator:"", targetMinutes:15, targetWords:2630, status:"CONTENT_REVIEW", fullBookReady:true, sourceRepo:"Project Gutenberg", sourceEbookId:"64317", sourceUrl:"https://www.gutenberg.org/ebooks/64317", rightsStatus:"TERRITORIAL_REVIEW_REQUIRED", bookSource:"books/the-great-gatsby.js" },'
          if old not in c:
              raise SystemExit("Gatsby catalog entry not found")
          catalog.write_text(c.replace(old, new), encoding="utf-8")
          PY
          node --check books/the-great-gatsby.js
          python - <<'PY'
          from pathlib import Path
          s = Path("fulltext/the-great-gatsby.txt").read_text(encoding="utf-8")
          assert len(s.split()) >= 40000
          assert "The Great Gatsby" in s
          assert "In my younger and more vulnerable years" in s
          assert "borne back ceaselessly into the past" in s
          print("Gatsby source and metadata verification passed")
          PY
      - name: Commit and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/acquire-the-great-gatsby.yml .github/workflows/finalize-gatsby.yml
          git add books/the-great-gatsby.js catalog/index.js
          git commit -m "Finalize The Great Gatsby source-ready integration"
          git push
