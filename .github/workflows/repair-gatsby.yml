name: Repair Gatsby Metadata
on:
  push:
    paths:
      - ".github/workflows/repair-gatsby.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("books/the-great-gatsby.js")
          s=p.read_text(encoding="utf-8")
          s=s.replace('readerSourceStatus: "SOURCE_PENDING",','readerSourceStatus: "SOURCE_READY",\n\n    fullTextUrl: "fulltext/the-great-gatsby.txt",\n\n    fullTextSourceType: "COMPLETE_SOURCE_ASSET",\n\n    fullTextSourceVerified: true,\n\n    fullBookReady: true,\n\n    fifteenMinuteStartMarker: "In my younger and more vulnerable years",\n\n    sourceEdition: "Project Gutenberg eBook #64317, 1925 text",\n\n    sourceUrl: "https://www.gutenberg.org/ebooks/64317",')
          start=s.find("    text:\n")
          end=s.find("\n\n};",start)
          if start<0 or end<0: raise SystemExit("Gatsby text block not found")
          s=s[:start]+'    text: ""'+s[end+2:]
          p.write_text(s,encoding="utf-8")
          q=Path("catalog/index.js")
          c=q.read_text(encoding="utf-8")
          c=c.replace('targetMinutes:15, status:"CONTENT_REVIEW", fullBookReady:false, bookSource:"books/the-great-gatsby.js"','targetMinutes:15, targetWords:2630, status:"CONTENT_REVIEW", fullBookReady:true, sourceRepo:"Project Gutenberg", sourceEbookId:"64317", sourceUrl:"https://www.gutenberg.org/ebooks/64317", rightsStatus:"TERRITORIAL_REVIEW_REQUIRED", bookSource:"books/the-great-gatsby.js"')
          q.write_text(c,encoding="utf-8")
          PY
          node --check books/the-great-gatsby.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/acquire-the-great-gatsby.yml .github/workflows/finalize-gatsby.yml .github/workflows/repair-gatsby.yml
          git add books/the-great-gatsby.js catalog/index.js
          git commit -m "Finalize The Great Gatsby source-ready integration"
          git push