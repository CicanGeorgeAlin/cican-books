name: Compare 1813 Reference
# Audit execution trigger: 1813 reconstruction comparison; syntax-corrected title normalization

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/compare-1813-reference.yml"
      - "tools/compare-first-edition.mjs"
      - "tools/fetch-wikisource-1813-reference.mjs"
      - "fulltext/pride-and-prejudice.txt"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Wikisource 1813 reference
        run: node tools/fetch-wikisource-1813-reference.mjs tmp/pride-and-prejudice-1813-wikisource.txt

      - name: Compare reference with canonical text
        run: node tools/compare-first-edition.mjs tmp/pride-and-prejudice-1813-wikisource.txt fulltext/pride-and-prejudice.txt tmp/pride-and-prejudice-1813-comparison.json

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: pride-and-prejudice-1813-comparison
          path: tmp/pride-and-prejudice-1813-comparison.json
          retention-days: 7
