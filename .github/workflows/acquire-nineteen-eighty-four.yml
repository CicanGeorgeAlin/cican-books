name: Acquire Nineteen Eighty-Four Complete Text
on:
  push:
    paths:
      - ".github/workflows/acquire-nineteen-eighty-four.yml"
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download complete source
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from pathlib import Path
          url='https://gutenberg.net.au/ebooks01/0100021.txt'
          raw=urlopen(url,timeout=60).read().decode('utf-8')
          start=raw.find('A Project Gutenberg of Australia eBook')
          if start < 0: raise SystemExit('PG Australia source marker not found')
          Path('fulltext/nineteen-eighty-four.txt').write_text(raw.strip()+'\n',encoding='utf-8')
          print('characters:',len(raw))
          print('words:',len(raw.split()))
          PY
      - name: Verify complete source
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('fulltext/nineteen-eighty-four.txt').read_text(encoding='utf-8')
          n=' '.join(s.lower().split())
          required=['nineteen eighty-four','part one','chapter 1','it was a bright cold day in april','the principles of newspeak']
          for m in required:
              if m not in n: raise SystemExit('Missing required marker: '+m)
          if len(s.split()) < 80000: raise SystemExit('Source unexpectedly short')
          print('Nineteen Eighty-Four complete-source verification passed')
          PY
      - name: Publish asset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fulltext/nineteen-eighty-four.txt
          git commit -m 'Add Nineteen Eighty-Four complete source asset'
          git push