<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000;scroll-behavior:smooth}
body{min-height:100vh;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;overflow-y:auto;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.page{position:relative;z-index:1;width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 20px 52px}
.background{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:.032}
.background-track{position:absolute;width:max-content;white-space:nowrap;color:#fff;font-size:clamp(90px,15vw,220px);font-weight:900;letter-spacing:-.08em;line-height:.8;animation:backgroundFlow 60s linear infinite}
.background-track:nth-child(1){top:7%}
.background-track:nth-child(2){top:39%;animation-duration:75s;animation-direction:reverse}
.background-track:nth-child(3){top:71%;animation-duration:68s}
@keyframes backgroundFlow{from{transform:translateX(-30%)}to{transform:translateX(0)}}
.hero{width:100%;max-width:900px;min-height:610px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cican-link{display:flex;align-items:center;justify-content:center;text-decoration:none;margin-bottom:30px;border-radius:50%;-webkit-tap-highlight-color:transparent}
.cican{position:relative;width:150px;height:150px;border-radius:50%;background:#fff;box-shadow:0 0 16px rgba(255,255,255,1),0 0 38px rgba(255,255,255,.82),0 0 72px rgba(255,255,255,.48),0 0 120px rgba(255,255,255,.20);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.02)}}
.eye{position:absolute;width:19px;height:27px;background:#000;border-radius:50%;top:57px}
.eye.left{left:43px}.eye.right{right:43px}
.brand{color:#fff;font-size:clamp(56px,10vw,94px);line-height:.9;font-weight:900;letter-spacing:-.075em;margin-left:-.075em}
.brand-motto{margin-top:17px;color:rgba(255,255,255,.72);font-size:clamp(11px,2vw,13px);font-weight:700;letter-spacing:.25em;line-height:1.4;text-transform:uppercase}
.subtitle{margin-top:25px;color:#fff;font-size:clamp(17px,3vw,25px);font-weight:700;letter-spacing:.22em;line-height:1.3;text-transform:uppercase}
.minutes{margin-top:17px;color:rgba(255,255,255,.48);font-size:12px;font-weight:700;letter-spacing:.34em;text-transform:uppercase}
.play-button{display:inline-flex;align-items:center;justify-content:center;min-width:174px;min-height:58px;margin-top:38px;padding:0 30px;border:1px solid rgba(255,255,255,.70);border-radius:100px;background:#fff;color:#000;text-decoration:none;font-size:14px;font-weight:900;letter-spacing:.22em;transition:transform .2s ease,box-shadow .2s ease;-webkit-tap-highlight-color:transparent}
.play-button:hover{transform:scale(1.045);box-shadow:0 0 18px rgba(255,255,255,.45),0 0 40px rgba(255,255,255,.20)}
.play-button:active{transform:scale(.97)}
.cican-link:focus-visible,.play-button:focus-visible{outline:2px solid #fff;outline-offset:5px}
.footer{width:100%;max-width:760px;margin-top:27px;padding-top:22px;border-top:1px solid rgba(255,255,255,.07);text-align:center}
.footer-brand{color:rgba(255,255,255,.30);font-size:10px;font-weight:800;letter-spacing:.32em;text-transform:uppercase}
@media(max-width:600px){
.page{padding:22px 14px 40px}
.hero{min-height:590px}
.cican{width:126px;height:126px}
.eye{width:16px;height:23px;top:48px}
.eye.left{left:36px}.eye.right{right:36px}
.brand{font-size:clamp(53px,18vw,80px)}
.brand-motto{margin-top:15px;font-size:9px;letter-spacing:.19em}
.subtitle{margin-top:22px;font-size:16px;letter-spacing:.16em}
.minutes{margin-top:15px;font-size:10px;letter-spacing:.24em}
.play-button{min-width:156px;min-height:54px;margin-top:32px}
}
@media(max-width:360px){
.hero{min-height:560px}
.cican{width:112px;height:112px}
.eye{width:14px;height:21px;top:43px}
.eye.left{left:32px}.eye.right{right:32px}
.brand-motto{font-size:8px}
}
@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
.background-track,.cican{animation:none}
.play-button{transition:none}
}
