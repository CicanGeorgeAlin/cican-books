<script type="module">
import { CATALOG } from "./catalog/index.js";
const publicBooks=CATALOG.filter(function(b){return b.visibility==="PUBLIC";});
const books=publicBooks.slice().sort(function(a,b){return a.title.localeCompare(b.title);});
const list=document.getElementById("books"),search=document.getElementById("search"),count=document.getElementById("count"),mode=document.getElementById("mode"),alphabet=document.getElementById("alphabet");
let letter="ALL";
["ALL"].concat("ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")).forEach(function(l){const b=document.createElement("button");b.className="letter"+(l==="ALL"?" active":"");b.type="button";b.textContent=l;b.setAttribute("aria-label",l==="ALL"?"Show all books":"Show books beginning with "+l);b.addEventListener("click",function(){letter=l;search.value="";document.querySelectorAll(".letter").forEach(function(x){x.classList.toggle("active",x===b);});render();});alphabet.appendChild(b);});
function escCover(value){return String(value==null?"":value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/\x27/g,"&apos;");}
function makeCover(b){
  const title=escCover(b.title);
  const author=escCover(b.author);
  const category=escCover((b.category||"CLASSIC").toUpperCase());
  const words=String(b.title||"").trim().split(/\s+/);
  const lines=[];
  let line="";
  const maxChars=16;
  for(const word of words){
    const next=(line+" "+word).trim();
    if(next.length>maxChars&&line){lines.push(line);line=word;}
    else line=next;
  }
  if(line)lines.push(line);
  const fitted=lines.length>4?[
    lines.slice(0,2).join(" "),
    lines.slice(2,4).join(" "),
    lines.slice(4).join(" ")
  ].filter(Boolean):lines;
  const fontSize=fitted.length>=4?34:fitted.length===3?38:42;
  const lineHeight=fontSize*1.22;
  const totalHeight=(fitted.length-1)*lineHeight;
  const firstY=438-totalHeight/2;
  const titleSvg=fitted.map((part,i)=>
    '<text x="300" y="'+(firstY+i*lineHeight)+'" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="'+fontSize+'" font-weight="700" letter-spacing="0.4" textLength="450" lengthAdjust="spacingAndGlyphs" fill="#ffffff">'+escCover(part)+'</text>'
  ).join("");
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 600 900" role="img"><title>'+title+' — '+author+'</title><rect width="600" height="900" fill="#050505"/><rect x="22" y="22" width="556" height="856" fill="none" stroke="#f5f5f5" stroke-width="2"/><rect x="34" y="34" width="532" height="832" fill="none" stroke="#777777" stroke-width="1"/><path d="M72 125H528M72 775H528" stroke="#eeeeee" stroke-width="1.5"/><text x="300" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="8" fill="#ffffff">CICAN BOOKS</text><text x="300" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" letter-spacing="4" fill="#aaaaaa">'+category+'</text><path d="M250 205H350" stroke="#777777" stroke-width="1"/><g>'+titleSvg+'</g><path d="M250 665H350" stroke="#777777" stroke-width="1"/><text x="300" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="2.2" fill="#eeeeee">'+author+'</text><text x="300" y="815" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" letter-spacing="4" fill="#aaaaaa">A CLASSIC READING EDITION</text></svg>';
  const image=document.createElement("img");
  image.className="cover cover-image cican-cover-art";
  image.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  image.alt="Typographic black and white cover for "+b.title+" by "+b.author;
  image.loading="lazy";
  image.decoding="async";
  image.width=1200;
  image.height=1800;
  return image;
}
function render(){const term=search.value.trim().toLowerCase();const results=books.filter(function(b){const starts=letter==="ALL"||b.title.trim().toUpperCase().startsWith(letter);const text=[b.title,b.author,b.category,b.translator].filter(Boolean).join(" ").toLowerCase();return starts&&text.includes(term);});
count.textContent=results.length+" "+(results.length===1?"BOOK":"BOOKS");mode.textContent=term?"SEARCH":letter==="ALL"?"ALL BOOKS":letter+" · BOOKS";list.innerHTML="";
if(!results.length){list.innerHTML='<div class="empty">NO BOOKS FOUND</div>';return;}
results.forEach(function(b){const link=document.createElement("a");link.className="book"+(b.id==="dhammapada"?" featured":"");link.href="reader.html?book="+encodeURIComponent(b.id);link.setAttribute("aria-label","Read "+b.title+" by "+b.author);link.setAttribute("role","listitem");link.appendChild(makeCover(b));const number=document.createElement("span");number.className="book-number";number.textContent="#"+String(publicBooks.indexOf(b)+1).padStart(2,"0");link.appendChild(number);const copy=document.createElement("span");copy.className="book-copy";const titleText=document.createElement("span");titleText.className="title";titleText.textContent=b.title;const meta=document.createElement("span");meta.className="meta";meta.textContent=b.author+(b.category?" · "+b.category:"");copy.append(titleText,meta);link.appendChild(copy);list.appendChild(link);});}
search.addEventListener("input",function(){letter="ALL";document.querySelectorAll(".letter").forEach(function(x){x.classList.toggle("active",x.textContent==="ALL");});render();});render();
