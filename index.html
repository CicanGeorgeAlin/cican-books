<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000}
body{min-height:100vh;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.page{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.hero{width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cican-link{display:flex;align-items:center;justify-content:center;text-decoration:none;margin-bottom:34px;border-radius:50%;-webkit-tap-highlight-color:transparent}
.cican{position:relative;width:150px;height:150px;border-radius:50%;background:#fff;box-shadow:0 0 16px rgba(255,255,255,1),0 0 38px rgba(255,255,255,.82),0 0 72px rgba(255,255,255,.48),0 0 120px rgba(255,255,255,.20);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.02)}}
.eye{position:absolute;width:19px;height:27px;background:#000;border-radius:50%;top:57px}
.eye.left{left:43px}.eye.right{right:43px}
.brand{color:#fff;font-size:clamp(56px,10vw,94px);line-height:.9;font-weight:900;letter-spacing:-.075em;margin-left:-.075em}
.subtitle{margin-top:24px;color:rgba(255,255,255,.78);font-size:clamp(16px,3vw,23px);font-weight:700;letter-spacing:.20em;line-height:1.3;text-transform:uppercase}
.play-button{display:inline-flex;align-items:center;justify-content:center;min-width:174px;min-height:58px;margin-top:38px;padding:0 30px;border:1px solid rgba(255,255,255,.70);border-radius:100px;background:#fff;color:#000;text-decoration:none;font-size:14px;font-weight:900;letter-spacing:.22em;transition:transform .2s ease,box-shadow .2s ease;-webkit-tap-highlight-color:transparent}
.play-button:hover{transform:scale(1.045);box-shadow:0 0 18px rgba(255,255,255,.45),0 0 40px rgba(255,255,255,.20)}
.play-button:active{transform:scale(.97)}
.support-link{display:inline-flex;align-items:center;justify-content:center;margin-top:16px;color:rgba(255,255,255,.42);text-decoration:none;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;transition:color .2s ease;-webkit-tap-highlight-color:transparent}
.support-link:hover{color:#fff}
.cican-link:focus-visible,.play-button:focus-visible,.support-link:focus-visible{outline:2px solid #fff;outline-offset:5px}
@media(max-width:600px){
.page{padding:20px 14px}
.cican-link{margin-bottom:29px}
.cican{width:126px;height:126px}
.eye{width:16px;height:23px;top:48px}
.eye.left{left:36px}.eye.right{right:36px}
.brand{font-size:clamp(53px,18vw,80px)}
.subtitle{margin-top:20px;font-size:15px;letter-spacing:.15em}
.play-button{min-width:156px;min-height:54px;margin-top:32px}
.support-link{margin-top:15px;font-size:8px;letter-spacing:.14em}
}
@media(max-width:360px){
.cican{width:112px;height:112px}
.eye{width:14px;height:21px;top:43px}
.eye.left{left:32px}.eye.right{right:32px}
}
@media(prefers-reduced-motion:reduce){
.cican{animation:none}
.play-button,.support-link{transition:none}
}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<main class="page">
<section class="hero" aria-labelledby="brand-title">
<a class="cican-link" href="library.html" aria-label="Enter CICAN library">
<div class="cican" aria-hidden="true"><div class="eye left"></div><div class="eye right"></div></div>
</a>
<h1 id="brand-title" class="brand">CICAN</h1>
<div class="subtitle">PLAY THE BOOK</div>
<a class="play-button" href="library.html">PLAY</a>
<a class="support-link" href="https://buymeacoffee.com/cican" target="_blank" rel="noopener noreferrer" aria-label="Support CICAN on Buy Me a Coffee">SUPPORT CICAN ☕</a>
</section>
</main>
