<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>CICAN — UNDERSTAND</title>
<meta name="description" content="CICAN — Understand a sacred text through experience, source, context, concepts, and exploration.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
.page{width:100%;min-height:100vh;padding:24px 18px 60px}
.shell{width:100%;max-width:820px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{color:#fff;text-decoration:none;font-size:18px;font-weight:900;letter-spacing:-.06em}
.back{color:rgba(255,255,255,.42);text-decoration:none;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.hero{text-align:center;padding:70px 0 45px}
.eyebrow{color:rgba(255,255,255,.42);font-size:10px;font-weight:700;letter-spacing:.35em;text-transform:uppercase;margin-bottom:18px}
h1{font-size:clamp(32px,8vw,58px);font-weight:900;letter-spacing:-.06em}
.subtitle{margin-top:14px;color:rgba(255,255,255,.48);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.bookline{margin-top:24px;font-size:18px;font-weight:800}
.tradition{margin-top:6px;color:rgba(255,255,255,.40);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border:1px solid rgba(255,255,255,.10);border-radius:20px;padding:24px;background:rgba(255,255,255,.025)}
.card.wide{grid-column:1/-1}
.label{color:rgba(255,255,255,.40);font-size:9px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;margin-bottom:13px}
.card h2{font-size:20px;line-height:1.15;margin-bottom:12px}
.card p{color:rgba(255,255,255,.70);font-size:14px;line-height:1.7}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}
.tag{padding:7px 10px;border:1px solid rgba(255,255,255,.12);border-radius:100px;color:rgba(255,255,255,.68);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:9px}
.item{padding:12px 0;border-top:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.68);font-size:13px;line-height:1.55}
.item:first-child{border-top:0;padding-top:0}
.item strong{color:#fff}
.source{border-color:rgba(255,255,255,.20)}
.source p{color:rgba(255,255,255,.78)}
.source-link{display:inline-block;margin-top:16px;color:#fff;text-decoration:none;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:4px}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}
.action{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border:1px solid rgba(255,255,255,.55);border-radius:100px;background:#fff;color:#000;text-decoration:none;font-size:11px;font-weight:900;letter-spacing:.18em}
.action.secondary{background:transparent;color:#fff;border-color:rgba(255,255,255,.22)}
.footer{text-align:center;margin-top:55px;color:rgba(255,255,255,.20);font-size:9px;font-weight:800;letter-spacing:.3em}
@media(max-width:620px){.grid{grid-template-columns:1fr}.card.wide{grid-column:auto}.hero{padding:55px 0 35px}.card{padding:20px}}
</style>
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<main class="page">
<div class="shell">
<header class="top">
<a class="logo" href="index.html">CICAN</a>
<a class="back" href="library.html">LIBRARY</a>
</header>
<section class="hero">
<div class="eyebrow">CICAN — PLAY THE BOOK</div>
<h1>UNDERSTAND</h1>
<div class="subtitle">Experience → Understand → Read</div>
<div id="bookline" class="bookline"></div>
<div id="tradition" class="tradition"></div>
</section>
<section id="content" class="grid"></section>
<div class="actions">
<a id="read" class="action" href="#">READ</a>
<a class="action secondary" href="library.html">CHOOSE ANOTHER TEXT</a>
</div>
<footer class="footer">CICAN · SACRED LIBRARY</footer>
</div>
</main>
<script>
const DATA={
dhammapada:{
title:"THE DHAMMAPADA",tradition:"Buddhism · F. Max Müller",
dna:["thought","action","consequence","awareness","restraint","clarity","path"],
experience:"You encountered a world that responds to movement and stillness. Movement disturbs the surrounding points of light; sustained stillness allows them to gather and become calmer. The experience is designed around noticing consequence rather than being given a conventional score.",
says:[
"Chapter I connects experience with the mind: the selected verses describe actions and consequences in relation to thought.",
"Chapters II and III emphasize heedfulness, attention, and the restless nature of the mind.",
"Chapters XXIV–XXVI return to thirst, restraint, self-control, contemplation, and the path toward freedom."
],
context:"The CICAN experience uses selected complete verses from all 26 chapters. The source edition is The Sacred Books of the East, Volume X, Part I, translated by F. Max Müller. The source note for this experience identifies the selection as material drawn across the complete 26-chapter structure.",
concepts:["Mind","Heedfulness","Action","Consequence","Restraint","Thirst","Self-control","Path"],
interpretation:"CICAN presents the experience as an invitation to notice relationships between movement, stillness, impulse, and consequence. This is the CICAN experience layer, not a replacement for the text or a claim about how every Buddhist tradition interprets it.",
source:"The Dhammapada, Project Gutenberg eBook #2017 · translation by F. Max Müller.",
url:"https://www.gutenberg.org/ebooks/2017"
},
tao:{
title:"TAO TE CHING",tradition:"Taoism · Laozi · James Legge",
dna:["flow","stillness","emptiness","non-striving","softness","return","simplicity"],
experience:"You encountered a flowing world. Movement disturbs nearby flow; the surrounding field continues in its own rhythm. The experience uses flow, stillness, emptiness, and non-forcing as interactive ideas rather than turning the text into a quiz.",
says:[
"Chapter 1 introduces the tension between what can be named and what cannot be fully named.",
"Chapters 8 and 78 use water as an image of softness, low places, and overcoming without force.",
"Chapters 15, 16, 48 and 64 return to stillness, return, diminishing action, careful beginnings, and natural development."
],
context:"The CICAN experience uses selected complete chapters from across the Tao Te Ching. The source edition is The Texts of Taoism, The Sacred Books of the East, Volume XXXIX, using the James Legge translation.",
concepts:["Flow","Stillness","Emptiness","Water","Non-striving","Softness","Return","Simplicity"],
interpretation:"CICAN presents flow and non-forcing as experiential mechanics so the player can observe a system rather than receive a predetermined lesson. This is the CICAN experience layer, distinct from the source text and from later scholarly interpretations.",
source:"Tao Te Ching · James Legge translation · Project Gutenberg eBook #216.",
url:"https://www.gutenberg.org/ebooks/216"
}
};
const id=new URLSearchParams(location.search).get("book")||"dhammapada";
const b=DATA[id]||DATA.dhammapada;
document.getElementById("bookline").textContent=b.title;
document.getElementById("tradition").textContent=b.tradition;
document.getElementById("read").href="v16.html?book="+encodeURIComponent(id);
const dna=b.dna.map(x=>'<span class="tag">'+x+"</span>").join("");
const says=b.says.map(x=>'<div class="item">'+x+"</div>").join("");
const concepts=b.concepts.map(x=>'<span class="tag">'+x+"</span>").join("");
document.getElementById("content").innerHTML=
'<article class="card wide"><div class="label">01 · WHAT YOU EXPERIENCED</div><h2>The experience</h2><p>'+b.experience+'</p><div class="tags">'+dna+"</div></article>"+
'<article class="card"><div class="label">02 · WHAT THE TEXT SAYS</div><div class="list">'+says+"</div></article>"+
'<article class="card"><div class="label">03 · CONTEXT</div><p>'+b.context+'</p></article>'+
'<article class="card"><div class="label">04 · KEY CONCEPTS</div><div class="tags">'+concepts+"</div></article>"+
'<article class="card"><div class="label">05 · INTERPRETATIONS</div><p>'+b.interpretation+'</p></article>'+
'<article class="card source"><div class="label">06 · SOURCE</div><p>'+b.source+'</p><a class="source-link" href="'+b.url+'" target="_blank" rel="noopener">OPEN SOURCE</a></article>';
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
}
</script>
</body>
</html>
